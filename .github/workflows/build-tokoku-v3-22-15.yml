name: Build TokoKu v3.22.15 - Belanja Operasional FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract TokoKu source
        run: |
          set -e
          ZIP="$(find . -type f -name 'TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
          fi
          test -n "$ZIP"

          rm -rf build-project
          mkdir build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE"

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Fix receipt footer
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          old_list = [
              "Terima kasih telah berbelanja di TokoKu",
              "Terima kasih telah berbelanja di Tokoku",
              "Terimakasih telah berbelanja di TokoKu",
              "Terimakasih telah berbelanja di Tokoku",
          ]
          new = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"

          changed = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in {
                  ".html",".htm",".js",".jsx",".ts",".tsx",
                  ".kt",".java",".xml",".json",".txt"
              }:
                  continue

              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              ns = s

              for old in old_list:
                  ns = ns.replace(old, new)

              if ns != s:
                  p.write_text(ns, encoding="utf-8")
                  changed.append(str(p))

          print("Footer changed:", changed)

          if not any(
              new in p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )
              for p in root.rglob("*")
              if p.is_file()
          ):
              raise SystemExit("STOP: footer RangMudo Jr tidak ditemukan.")

          PY

      - name: Rapihkan Pengeluaran dan Tambah Kategori
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("app/src/main").rglob("index.html")
          )

          if not candidates:
              raise SystemExit(
                  "STOP: index.html tidak ditemukan."
              )

          target = candidates[0]
          s = target.read_text(encoding="utf-8")

          if "tokoku-pengeluaran-kategori-v2" in s:
              print("Patch kategori sudah ada.")
              raise SystemExit(0)

          patch = r"""
          <style id="tokoku-pengeluaran-kategori-v2">
          #tokoku-expense-cat-wrap{
            display:flex;
            gap:8px;
            margin:10px 0;
          }

          .tokoku-expense-cat{
            flex:1;
            border:1px solid #dce4ec;
            background:#fff;
            color:#65717f;
            border-radius:12px;
            padding:10px 8px;
            font-size:12px;
            font-weight:700;
          }

          .tokoku-expense-cat.active{
            background:#1476df;
            color:#fff;
            border-color:#1476df;
          }

          .tokoku-expense-category-hidden{
            display:none !important;
          }
          </style>

          <script id="tokoku-pengeluaran-kategori-v2">
          (function(){
            "use strict";

            const CATEGORY_KEY =
              "tokoku-expense-category-v2";

            const CATEGORIES = [
              "Belanja",
              "Operasional"
            ];

            function readCategories(){
              try{
                return JSON.parse(
                  localStorage.getItem(
                    CATEGORY_KEY
                  ) || "{}"
                );
              }catch(e){
                return {};
              }
            }

            function writeCategories(data){
              try{
                localStorage.setItem(
                  CATEGORY_KEY,
                  JSON.stringify(data)
                );
              }catch(e){}
            }

            function makeKey(item){
              const text =
                (item.innerText || "")
                .trim();

              return btoa(
                unescape(
                  encodeURIComponent(text)
                )
              ).slice(0,180);
            }

            function findExpenseSection(){
              const all = [
                ...document.querySelectorAll(
                  "section,main,div"
                )
              ];

              return all.find(el=>{
                const text =
                  (el.innerText || "")
                  .trim();

                return (
                  /pengeluaran/i.test(text) &&
                  el.querySelector(
                    "button,input,select,.card,.item"
                  )
                );
              });
            }

            function findExpenseItems(section){
              const selectors = [
                "#expenseList",
                ".expense-list",
                ".pengeluaran-list",
                "[id*=expense] [class*=item]",
                "[id*=pengeluaran] [class*=item]",
                "[class*=expense] .card",
                "[class*=pengeluaran] .card"
              ];

              for(
                const selector of selectors
              ){
                const items = [
                  ...section.querySelectorAll(
                    selector
                  )
                ];

                if(items.length){
                  return items.filter(
                    item =>
                      !item.closest(
                        "#tokoku-expense-category-wrap"
                      )
                  );
                }
              }

              return [
                ...section.children
              ].filter(item=>{
                const text =
                  (item.innerText || "")
                  .trim();

                return (
                  text &&
                  /\d/.test(text) &&
                  !/tambah|simpan|pengeluaran/i.test(text)
                );
              });
            }

            function build(){
              const section =
                findExpenseSection();

              if(!section){
                return;
              }

              const items =
                findExpenseItems(section);

              if(!items.length){
                return;
              }

              let wrap =
                document.getElementById(
                  "tokoku-expense-category-wrap"
                );

              if(wrap){
                wrap.remove();
              }

              const data =
                readCategories();

              let selected =
                "Belanja";

              wrap =
                document.createElement("div");

              wrap.id =
                "tokoku-expense-category-wrap";

              wrap.innerHTML =
                '<div id="tokoku-expense-cat-wrap">' +
                '</div>';

              const buttons =
                wrap.querySelector(
                  "#tokoku-expense-cat-wrap"
                );

              CATEGORIES.forEach(
                category=>{
                  const button =
                    document.createElement(
                      "button"
                    );

                  button.type = "button";

                  button.className =
                    "tokoku-expense-cat";

                  button.textContent =
                    category;

                  button.dataset.category =
                    category;

                  button.addEventListener(
                    "click",
                    function(event){
                      event.preventDefault();
                      event.stopPropagation();
                      event.stopImmediatePropagation();

                      selected =
                        category;

                      apply();
                    },
                    true
                  );

                  buttons.appendChild(
                    button
                  );
                }
              );

              function apply(){
                buttons
                  .querySelectorAll("button")
                  .forEach(button=>{
                    button.classList.toggle(
                      "active",
                      button.dataset.category ===
                      selected
                    );
                  });

                items.forEach(item=>{
                  const key =
                    makeKey(item);

                  /*
                   * Data lama yang belum mempunyai
                   * kategori dianggap Belanja.
                   */
                  const category =
                    data[key] ||
                    "Belanja";

                  item.classList.toggle(
                    "tokoku-expense-category-hidden",
                    category !== selected
                  );
                });
              }

              /*
               * Tempel sebagai elemen biasa,
               * bukan sebagai bagian dari form.
               */
              const parent =
                items[0].parentNode;

              parent.insertBefore(
                wrap,
                items[0]
              );

              apply();
            }

            let timer = null;

            function schedule(){
              clearTimeout(timer);

              timer =
                setTimeout(
                  build,
                  500
                );
            }

            document.addEventListener(
              "DOMContentLoaded",
              schedule
            );

            window.addEventListener(
              "load",
              schedule
            );

            const observer =
              new MutationObserver(
                schedule
              );

            observer.observe(
              document.documentElement,
              {
                childList:true,
                subtree:true
              }
            );

          })();
          </script>
          """

          if "</body>" not in s.lower():
              raise SystemExit(
                "STOP: </body> tidak ditemukan."
              )

          index =
              s.lower().rfind("</body>")

          s =
              s[:index] +
              patch +
              s[index:]

          target.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Kategori Belanja/Operasional "
              "ditambahkan:",
              target
          )

          PY

      - name: Set version 3.22.15
        run: |
          set -e

          sed -i -E \
            "s/versionCode[[:space:]]+[0-9]+/versionCode 40/" \
            app/build.gradle

          sed -i -E \
            "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '3.22.15'/" \
            app/build.gradle

          grep -q "versionCode 40" \
            app/build.gradle

          grep -q "versionName '3.22.15'" \
            app/build.gradle

      - name: Build DEBUG APK
        run: |
          set -e

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Belanja-Operasional-FIX
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error