name: Build TokoKu v3.22.15 - Pengeluaran Harian

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find TokoKu v3.22.15 ZIP
        run: |
          echo "Mencari ZIP TokoKu v3.22.15..."
          find . -maxdepth 3 -type f -iname "*3.22.15*.zip" -print

          ZIP=$(find . -maxdepth 3 -type f -iname "*3.22.15*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu v3.22.15 tidak ditemukan."
            echo "Daftar file ZIP:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract TokoKu source
        run: |
          rm -rf tokoku-source
          mkdir -p tokoku-source

          echo "Extract: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d tokoku-source

          echo "Isi hasil extract:"
          find tokoku-source -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=""

          SETTINGS=$(find tokoku-source \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            APP_GRADLE=$(find tokoku-source \
              -type f \
              -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$APP_GRADLE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Folder Android tidak ditemukan."
            find tokoku-source -type f | head -200
            exit 1
          fi

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Mencari APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(
