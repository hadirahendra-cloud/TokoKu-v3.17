name: Build TokoKu v3.22.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "TOKOKU_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf tokoku-source
          mkdir tokoku-source
          unzip -q "$TOKOKU_ZIP" -d tokoku-source

          echo "Isi source:"
          find tokoku-source -maxdepth 5 -type f | head -100

      - name: Locate Android Project
        run: |
          PROJECT=""

          while IFS= read -r file; do
            case "$file" in
              */settings.gradle|*/settings.gradle.kts)
                PROJECT="${file%/*}"
                break
                ;;
            esac
          done < <(find tokoku-source -type f)

          if [ -z "$PROJECT" ]; then
            while IFS= read -r file; do
              case "$file" in
                */app/build.gradle|*/app/build.gradle.kts)
                  PROJECT="${file%/app/"${file##*/}"}"
                  break
                  ;;
              esac
            done < <(find tokoku-source -type f)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Folder project Android tidak ditemukan"
            find tokoku-source -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/TokoKu-v3.22.15-debug.apk

          ls -lh output/TokoKu-v3.22.15-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-debug
          path: output/TokoKu-v3.22.15-debug.apk
          if-no-files-found: error