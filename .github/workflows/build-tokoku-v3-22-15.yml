name: Build TokoKu v3.22.15 - Belanja Operasional - FIX BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract TokoKu source
        run: |
          set -e

          ZIP="$(find . -type f -name 'TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
          fi

          test -n "$ZIP"

          rm -rf build-project
          mkdir build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE"

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Fix receipt footer
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          old_list = [
              "Terima kasih telah berbelanja di TokoKu",
              "Terima kasih telah berbelanja di Tokoku",
              "Terimakasih telah berbelanja di TokoKu",
              "Terimakasih telah berbelanja di Tokoku",
          ]

          new = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in {
                  ".html",".htm",".js",".jsx",".ts",".tsx",
                  ".kt",".java",".xml",".json",".txt"
              }:
                  continue

              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              ns = s

              for old in old_list:
                  ns = ns.replace(old, new)

              if ns != s:
                  p.write_text(ns, encoding="utf-8")

          hits = []

          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      if new in p.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ):
                          hits.append(str(p))
                  except Exception:
                      pass

          if not hits:
              raise SystemExit(
                  "STOP: footer RangMudo Jr tidak ditemukan."
              )

          print("Footer verified:", hits)
          PY

      - name: Keep Pengeluaran Harian
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("app/src/main").rglob("index.html")
          )

          if not candidates:
              raise SystemExit(
                  "STOP: index.html tidak ditemukan."
              )

          target = candidates[0]
          s = target.read_text(encoding="utf-8")

          if "tokoku-pengeluaran-tab-harian-v1" in s:
              print("Pengeluaran Harian sudah tersedia.")
          else:
              print(
                  "Pengeluaran Harian patch tidak ditemukan; "
                  "source akan dipertahankan."
              )
          PY

      - name: Add safe Belanja and Operasional tabs
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("app/src/main").rglob("index.html")
          )

          if not candidates:
              raise SystemExit(
                  "STOP: index.html tidak ditemukan."
              )

          target = candidates[0]
          s = target.read_text(encoding="utf-8")

          if "tokoku-pengeluaran-kategori-safe-v1" in s:
              print("Kategori sudah ada.")
              raise SystemExit(0)

          patch = r"""
          <style id="tokoku-pengeluaran-kategori-safe-v1">
          #tokoku-expense-category-safe{
            display:flex;
            gap:8px;
            margin:8px 0 12px;
          }

          #tokoku-expense-category-safe button{
            flex:1;
            min-height:40px;
            border:1px solid #dce4ec;
            border-radius:12px;
            background:#fff;
            color:#65717f;
            font-weight:700;
            font-size:13px;
            padding:8px 10px;
          }

          #tokoku-expense-category-safe button.active{
            background:#1476df;
            color:#fff;
            border-color:#1476df;
          }
          </style>

          <script id="tokoku-pengeluaran-kategori-safe-v1">
          (function(){
            "use strict";

            const WRAP_ID =
              "tokoku-expense-category-safe";

            const SELECTED_KEY =
              "tokoku-expense-selected-category";

            const CATEGORIES = [
              "Belanja",
              "Operasional"
            ];

            function findDayTabs(){
              return document.getElementById(
                "tokoku-expense-tabs-wrap"
              );
            }

            function build(){
              const dayTabs =
                findDayTabs();

              if(!dayTabs){
                return;
              }

              let wrap =
                document.getElementById(
                  WRAP_ID
                );

              if(wrap){
                return;
              }

              wrap =
                document.createElement("div");

              wrap.id = WRAP_ID;

              wrap.innerHTML =
                '<button type="button" data-category="Belanja">Belanja</button>' +
                '<button type="button" data-category="Operasional">Operasional</button>';

              dayTabs.parentNode.insertBefore(
                wrap,
                dayTabs
              );

              let selected =
                localStorage.getItem(
                  SELECTED_KEY
                ) || "Belanja";

              function apply(){
                wrap
                  .querySelectorAll("button")
                  .forEach(button=>{
                    button.classList.toggle(
                      "active",
                      button.dataset.category ===
                      selected
                    );
                  });
              }

              wrap
                .querySelectorAll("button")
                .forEach(button=>{
                  button.addEventListener(
                    "click",
                    function(event){
                      event.preventDefault();
                      event.stopPropagation();
                      event.stopImmediatePropagation();

                      selected =
                        button.dataset.category;

                      localStorage.setItem(
                        SELECTED_KEY,
                        selected
                      );

                      apply();

                      return false;
                    },
                    true
                  );
                });

              apply();
            }

            let timer = null;

            function schedule(){
              clearTimeout(timer);

              timer =
                setTimeout(
                  build,
                  700
                );
            }

            document.addEventListener(
              "DOMContentLoaded",
              schedule
            );

            window.addEventListener(
              "load",
              schedule
            );

            const observer =
              new MutationObserver(
                schedule
              );

            observer.observe(
              document.documentElement,
              {
                childList:true,
                subtree:true
              }
            );

          })();
          </script>
          """

          index = s.lower().rfind("</body>")

          if index < 0:
              raise SystemExit(
                  "STOP: </body> tidak ditemukan."
              )

          s =
            s[:index] +
            patch +
            s[index:]

          target.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Belanja & Operasional ditambahkan:",
              target
          )
          PY

      - name: Set version 3.22.15
        run: |
          set -e

          sed -i -E \
            "s/versionCode[[:space:]]+[0-9]+/versionCode 41/" \
            app/build.gradle

          sed -i -E \
            "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '3.22.15'/" \
            app/build.gradle

          grep -q "versionCode 41" \
            app/build.gradle

          grep -q "versionName '3.22.15'" \
            app/build.gradle

      - name: Build DEBUG APK
        run: |
          set -e

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare existing release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" |
            base64 --decode >
            "$RUNNER_TEMP/tokoku-release.jks"

          test -s \
            "$RUNNER_TEMP/tokoku-release.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          KS="$RUNNER_TEMP/tokoku-release.jks"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          OUT="app/build/outputs/apk/debug/TokoKu-v3.22.15-Belanja-Operasional.apk"

          test -n "$KEYSTORE_PASSWORD"

          keytool -list \
            -keystore "$KS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore.txt

          ALIAS="$(
            keytool -list -v \
              -keystore "$KS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              awk -F': ' '/Alias name:/{print $2; exit}'
          )"

          if [ -z "$ALIAS" ]; then
            ALIAS="$SECRET_ALIAS"
          fi

          test -n "$ALIAS"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ -n "$KEY_PASSWORD" ]; then
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$OUT" \
              "$APK" || rm -f "$OUT"
          fi

          if [ ! -s "$OUT" ]; then
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              --out "$OUT" \
              "$APK"
          fi

          test -s "$OUT"

      - name: Verify final APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/TokoKu-v3.22.15-Belanja-Operasional.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" |
            grep -E \
            "versionCode='41' versionName='3.22.15'"

          mkdir -p output

          cp "$APK" \
            "output/TokoKu-v3.22.15-Belanja-Operasional.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Belanja-Operasional
          path: output/TokoKu-v3.22.15-Belanja-Operasional.apk
          if-no-files-found: error
          retention-days: 30
