name: Build TokoKu v3.22.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Find TokoKu ZIP
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU ==="

          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "TOKOKU_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract TokoKu source
        shell: bash
        run: |
          echo "=== EXTRACT SOURCE ==="

          rm -rf tokoku-source
          mkdir -p tokoku-source

          unzip -q "$TOKOKU_ZIP" -d tokoku-source

          echo "=== HASIL EXTRACT ==="
          find tokoku-source -maxdepth 5 -type f | sort | head -200

      - name: Find Android project
        shell: bash
        run: |
          echo "=== MENCARI PROJECT ANDROID ==="

          PROJECT=""

          SETTINGS_FILE=$(find tokoku-source -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT" ]; then
            BUILD_FILE=$(find tokoku-source -type f \
              -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT=$(dirname "$(dirname "$BUILD_FILE")")
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan."

            echo "=== DAFTAR FILE ==="
            find tokoku-source -maxdepth 8 -type f | sort

            exit 1
          fi

          echo "PROJECT DITEMUKAN:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          echo "=== INSTALL GRADLE 8.7 ==="

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O gradle-8.7-bin.zip

          rm -rf "$HOME/gradle-8.7"

          unzip -q gradle-8.7-bin.zip -d "$HOME"

          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

          echo "Gradle:"
          "$HOME/gradle-8.7/bin/gradle" --version

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== PREPARE GRADLE ==="

          if [ -f "./gradlew" ]; then
            echo "gradlew ditemukan."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "gradlew TIDAK ditemukan."
            echo "Akan menggunakan Gradle 8.7 langsung."
            gradle --version
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== BUILD APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "=== MENCARI APK ==="

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo "=== FILE APK YANG ADA ==="
            find "$PROJECT_DIR" -type f -name "*.apk" | sort || true

            echo "=== BUILD OUTPUT ==="
            find "$PROJECT_DIR" -type d -path "*/build/outputs/*" | sort || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p output

          cp "$APK" \
            "output/TokoKu-v3.22.15-debug.apk"

          echo "APK siap:"
          ls -lh output/TokoKu-v3.22.15-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          echo "=== VERIFY APK ==="

          test -f output/TokoKu-v3.22.15-debug.apk

          ls -lh output/TokoKu-v3.22.15-debug.apk

          file output/TokoKu-v3.22