name: Build TokoKu v3.22.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Find TokoKu source
        run: |
          echo "Isi repository:"
          find . -maxdepth 2 -type f | sort | head -200

          ZIP=$(find . -maxdepth 2 -type f \
            \( -iname "TokoKu-v3.22.15*.zip" -o \
               -iname "TokoKu_v3.22.15*.zip" \) | head -1)

          if [ -n "$ZIP" ]; then
            echo "ZIP ditemukan: $ZIP"
            mkdir -p tokoku-source
            unzip -o "$ZIP" -d tokoku-source
          else
            echo "ZIP tidak ditemukan."
          fi

      - name: Find Android project
        run: |
          PROJECT=""

          if [ -f "./gradlew" ]; then
            PROJECT="."
          else
            PROJECT=$(find tokoku-source . -type f -name "settings.gradle*" \
              -not -path "./.git/*" | head -1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/TokoKu-v3.22.15-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-debug
          path: TokoKu-v3.22.15-debug.apk
          if-no-files-found: error