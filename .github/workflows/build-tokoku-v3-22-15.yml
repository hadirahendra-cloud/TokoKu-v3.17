name: Build TokoKu v3.22.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          adb version

      - name: Find ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP sumber tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project
          unzip -q "${{ steps.findzip.outputs.zip_file }}" -d tokoku-project

          echo "Isi hasil extract:"
          find tokoku-project -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          SETTINGS=$(find tokoku-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find tokoku-project -type f \( \
              -path "*/app/build.gradle" -o \
              -path "*/app/build.gradle.kts" \
            \) | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find tokoku-project -type f | sort
            exit 1
          fi

          echo "Project Android ditemukan: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            echo "gradlew tidak ditemukan."
            exit 1
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "${{ steps.project.outputs.project_dir }}" \
              -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK ditemukan: $APK"

          mkdir -p output
          cp "$APK" "output/TokoKu-v3.22.15-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-debug
          path: output/TokoKu-v3.22.15-debug.apk
          if-no-files-found: error