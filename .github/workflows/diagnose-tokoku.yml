name: Diagnose TokoKu Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find TokoKu ZIP
        run: |
          echo "=== MENCARI ZIP TokoKu ==="

          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract TokoKu v3.22.7
        run: |
          ZIP=$(find . -maxdepth 2 -type f \
            -name "TokoKu-v3.22.7-Penjualan-FIX-FINAL.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          mkdir -p tokoku_extract
          unzip -q "$ZIP" -d tokoku_extract

      - name: Find Dashboard Source
        run: |
          echo "================================"
          echo "FILE MENGANDUNG RINGKASAN TOKO"
          echo "================================"

          grep -RIl \
            --exclude-dir=.git \
            -e "Ringkasan Toko" \
            -e "Ringkasan" \
            tokoku_extract 2>/dev/null | head -50 || true

          echo ""
          echo "================================"
          echo "FILE MENGANDUNG AKSES CEPAT"
          echo "================================"

          grep -RIl \
            --exclude-dir=.git \
            -e "Akses Cepat" \
            -e "Penjualan" \
            tokoku_extract 2>/dev/null | head -50 || true

      - name: Show Android Source Files
        run: |
          echo "================================"
          echo "FILE SOURCE ANDROID"
          echo "================================"

          find tokoku_extract -type f \
            \( -name "*.kt" -o \
               -name "*.java" -o \
               -name "*.xml" \) \
            | head -100