name: Build TokoKu v3.22.15 - Pengeluaran Harian

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project and version
        run: |
          set -e
          test -f settings.gradle
          test -f app/build.gradle
          grep -q "versionCode 40" app/build.gradle
          grep -q "versionName '3.22.15'" app/build.gradle
          grep -q "Pengeluaran Harian" app/src/main/assets/index.html
          grep -q "expenseDayTabs" app/src/main/assets/index.html
          echo "Project TokoKu v3.22.15 + Pengeluaran Harian OK"

      - name: Build DEBUG APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            output/TokoKu-v3.22.15-Pengeluaran-Harian.apk

      - name: Verify APK
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | \
            grep -E "versionCode='40' versionName='3.22.15'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Pengeluaran-Harian
          path: output/TokoKu-v3.22.15-Pengeluaran-Harian.apk
          if-no-files-found: error
          retention-days: 30
