name: Build TokoKu v3.22.15 - Pengeluaran Harian Belanja Operasional FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Find and extract TokoKu source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -type f -name 'TokoKu-v3.22.15-Pengeluaran-Harian-TAB-HARI-GITHUB-READY.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP" ]; then
            echo "STOP: ZIP TokoKu tidak ditemukan."
            exit 1
          fi

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "STOP: app/build.gradle tidak ditemukan."
            find build-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Patch Pengeluaran Harian - Belanja dan Operasional
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")

          start = s.find('<section id="expenses" class="section">')
          end = s.find('</section>', start)
          if start < 0 or end < 0:
              raise SystemExit("STOP: section expenses tidak ditemukan.")

          new_section = r'''<section id="expenses" class="section"><h2>Pengeluaran Harian</h2>
          <div class="card">
            <div class="label">Bulan</div>
            <input id="expenseMonth" type="month" onchange="renderExpenses()">
            <div class="grid" style="margin-top:8px">
              <div><div class="label">Total</div><div class="metric" id="monthExpenseTotal">Rp 0</div></div>
              <div><div class="label">Jumlah</div><div class="metric" id="monthExpenseCount">0</div></div>
            </div>
          </div>
          <div id="tokoku-expense-category-tabs" style="display:flex;gap:8px;margin:10px 0">
            <button type="button" id="expenseTabBelanja" class="primary" style="flex:1" onclick="setExpenseCategory('Belanja')">🛒 Belanja</button>
            <button type="button" id="expenseTabOperasional" class="secondary" style="flex:1" onclick="setExpenseCategory('Operasional')">⚙️ Operasional</button>
          </div>
          <div id="expenseCategorySummary" class="card" style="margin-bottom:10px"></div>
          <div id="expenseList" style="margin-top:10px"></div>
          <button class="primary full" onclick="addExpenseMulti()">＋ Tambah Pengeluaran Hari Ini</button>
          <button class="secondary full" onclick="addExpense()">＋ Tambah 1 Pengeluaran</button>
          </section>'''

          s = s[:start] + new_section + s[end+len('</section>'):]

          pos = s.find('function expenseDate(x){')
          render_start = s.find('function renderExpenses(){', pos)
          delete_start = s.find('function deleteExpense(id){', render_start)
          if pos < 0 or render_start < 0 or delete_start < 0:
              raise SystemExit("STOP: fungsi pengeluaran tidak ditemukan.")

          new_js = r'''function getExpenseCategory(x){
            const c=String(x&&x.category||'').toLowerCase();
            if(c.includes('belanja')||c.includes('stok')||c.includes('barang')||c.includes('pembelian')) return 'Belanja';
            if(c.includes('operasional')) return 'Operasional';
            return 'Operasional';
          }
          function setExpenseCategory(category){
            localStorage.setItem('tokoku_expense_category',category);
            const b=document.getElementById('expenseTabBelanja');
            const o=document.getElementById('expenseTabOperasional');
            if(b&&o){
              b.className=category==='Belanja'?'primary':'secondary';
              o.className=category==='Operasional'?'primary':'secondary';
            }
            renderExpenses();
          }
          function getActiveExpenseCategory(){
            return localStorage.getItem('tokoku_expense_category')||'Belanja';
          }
          function renderExpenses(){
            let el=document.getElementById('expenseMonth');if(!el)return;
            let now=new Date();
            if(!el.value)el.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
            let ym=el.value, category=getActiveExpenseCategory();
            let all=db.expenses.filter(x=>{
              let d=expenseDate(x);
              return d&&d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===ym;
            });
            let a=all.filter(x=>getExpenseCategory(x)===category);
            let total=a.reduce((n,x)=>n+Number(x.amount||0),0);
            document.getElementById('monthExpenseTotal').textContent=R(total);
            document.getElementById('monthExpenseCount').textContent=a.length;

            let belanja=all.filter(x=>getExpenseCategory(x)==='Belanja').reduce((n,x)=>n+Number(x.amount||0),0);
            let operasional=all.filter(x=>getExpenseCategory(x)==='Operasional').reduce((n,x)=>n+Number(x.amount||0),0);
            let sum=document.getElementById('expenseCategorySummary');
            if(sum)sum.innerHTML='<div class="row"><b>🛒 Belanja</b><b>'+R(belanja)+'</b></div><div class="row" style="margin-top:7px"><b>⚙️ Operasional</b><b>'+R(operasional)+'</b></div><div class="small" style="margin-top:7px">Tab aktif: <b>'+category+'</b></div>';

            let groups={};
            a.forEach(x=>{
              let d=expenseDate(x),key=d?d.toISOString().slice(0,10):String(x.date||'').slice(0,10);
              (groups[key]||(groups[key]=[])).push(x);
            });
            let keys=Object.keys(groups).sort().reverse();
            document.getElementById('expenseList').innerHTML=keys.length?keys.map(key=>{
              let items=groups[key],dayTotal=items.reduce((n,x)=>n+Number(x.amount||0),0);
              let label=items[0]?.expenseDay||((expenseDate(items[0])||new Date()).toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}));
              return '<div class="card" style="margin-bottom:12px"><div class="row"><b>📅 '+label+'</b><b>'+R(dayTotal)+'</b></div><div class="small" style="margin:5px 0 8px">'+items.length+' item • '+category+'</div>'+items.map((x,i)=>'<div style="border-top:1px solid #edf0f3;padding:9px 0"><div class="row"><b>'+String(i+1)+'. '+String(x.item||'Pengeluaran')+'</b><b>'+R(x.amount)+'</b></div><div class="small">'+category+(x.qty?' • '+x.qty+' '+(x.unit||'unit')+' × '+R(x.unitPrice||0):'')+'</div><div class="small">'+(x.note||'-')+'</div><button class="danger" style="margin-top:6px" onclick="deleteExpense('+x.id+')">Hapus item</button></div>').join('')+'</div>';
            }).join(''):'<div class="card">Belum ada pengeluaran '+category.toLowerCase()+' pada bulan ini.</div>';

            const b=document.getElementById('expenseTabBelanja'),o=document.getElementById('expenseTabOperasional');
            if(b&&o){
              b.className=category==='Belanja'?'primary':'secondary';
              o.className=category==='Operasional'?'primary':'secondary';
            }
          }
          function addExpenseMulti(){
            let category=getActiveExpenseCategory();
            let dateInput=prompt('Tanggal pengeluaran (YYYY-MM-DD):',new Date().toISOString().slice(0,10));
            if(!dateInput)return;
            let day=new Date(dateInput+'T12:00:00');
            if(Number.isNaN(day.getTime()))return toast('Tanggal tidak valid');
            let expenseDay=day.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}),added=0;
            while(true){
              let item=prompt('Nama item '+category+' (kosong = selesai):','');
              if(item===null||!item.trim())break;
              let qty=Number(prompt('Jumlah:','1'))||1;if(qty<=0)qty=1;
              let unit=prompt('Satuan (pcs/kg/liter/dll):','pcs')||'unit';
              let unitPrice=Number(prompt('Harga satuan:','0'))||0;
              if(unitPrice<=0){toast('Harga satuan harus lebih dari 0');continue}
              let note=prompt('Keterangan:','')||'';
              let created=new Date(day);created.setHours(12,0,0,added);
              db.expenses.unshift({id:Date.now()+added,item:item.trim(),category,qty,unit,unitPrice,amount:qty*unitPrice,note,expenseDay,date:created.toLocaleString('id-ID'),createdAt:created.toISOString()});
              added++;
            }
            if(!added)return toast('Belum ada item yang ditambahkan');
            persist();renderExpenses();reports();toast(added+' item '+category+' tersimpan');
          }
          function addExpense(){
            let category=getActiveExpenseCategory();
            let item=prompt('Nama pengeluaran '+category+':',category);
            if(item===null)return;
            let amount=Number(prompt('Nominal pengeluaran:','0'))||0;
            if(amount<=0)return toast('Nominal harus lebih dari 0');
            let note=prompt('Keterangan:','')||'';
            let now=new Date();
            db.expenses.unshift({id:Date.now(),item:item.trim()||category,category,amount,note,date:now.toLocaleString('id-ID'),createdAt:now.toISOString()});
            persist();renderExpenses();reports();toast('Pengeluaran '+category+' tersimpan');
          }
          '''

          s = s[:render_start] + new_js + s[delete_start:]
          p.write_text(s,encoding="utf-8")

          check=p.read_text(encoding="utf-8")
          for needle in [
              'id="expenseTabBelanja"',
              'id="expenseTabOperasional"',
              'function setExpenseCategory(category)',
              'function getExpenseCategory(x)',
              'function addExpenseMulti()',
              'function addExpense()'
          ]:
              if needle not in check:
                  raise SystemExit("STOP: patch tidak lengkap: "+needle)

          print("Pengeluaran Harian Belanja/Operasional patch OK")
          PY

      - name: Fix receipt footer
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main")
          new="Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"
          old_list=[
            "Terima kasih telah berbelanja di TokoKu",
            "Terima kasih telah berbelanja di Tokoku",
            "Terimakasih telah berbelanja di TokoKu",
            "Terimakasih telah berbelanja di Tokoku",
          ]
          for p in root.rglob("*"):
            if p.is_file() and p.suffix.lower() in {".html",".htm",".js",".jsx",".ts",".tsx",".kt",".java",".xml",".json",".txt"}:
              try:
                text=p.read_text(encoding="utf-8")
              except Exception:
                continue
              changed=text
              for old in old_list:
                changed=changed.replace(old,new)
              if changed!=text:
                p.write_text(changed,encoding="utf-8")
          found=False
          for p in root.rglob("*"):
            if p.is_file():
              try:
                if new in p.read_text(encoding="utf-8",errors="ignore"):
                  found=True
                  break
              except Exception:
                pass
          if not found:
            raise SystemExit("STOP: footer baru tidak ditemukan.")
          PY

      - name: Set version 3.22.15
        run: |
          set -e
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 41/" app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['"][^'"]+['"]/versionName '3.22.15'/" app/build.gradle
          grep -q "versionCode 41" app/build.gradle
          grep -q "versionName '3.22.15'" app/build.gradle

      - name: Build DEBUG APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare existing TokoKu keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"
          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Sign with existing TokoKu key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/tokoku-release.jks"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/TokoKu-v3.22.15-Pengeluaran-Harian-Belanja-Operasional.apk"
          test -n "$KEYSTORE_PASSWORD"

          ALIAS="$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}')"
          if [ -z "$ALIAS" ]; then ALIAS="$SECRET_ALIAS"; fi
          test -n "$ALIAS"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$KS"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out "$OUT"             "$APK"

          test -s "$OUT"

      - name: Verify final APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/TokoKu-v3.22.15-Pengeluaran-Harian-Belanja-Operasional.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -E "versionCode='41' versionName='3.22.15'"
          mkdir -p output
          cp "$APK" output/

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Pengeluaran-Harian-Belanja-Operasional
          path: output/TokoKu-v3.22.15-Pengeluaran-Harian-Belanja-Operasional.apk
          if-no-files-found: error
          retention-days: 30
