name: Build TokoKu v3.22.9 - DIAGNOSTIC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract TokoKu v3.22.9
        run: |
          set -e

          ZIP="./TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            echo "$ZIP"
            echo ""
            echo "Isi repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path "*/app/build.gradle" -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            find build-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "===== PROJECT ====="
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "===== GRADLE CONFIG ====="
          grep -E "applicationId|minSdk|targetSdk|compileSdk|versionCode|versionName" app/build.gradle || true

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore OK."

      - name: Build signed release APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$TOKOKU_KEYSTORE_PASSWORD"
          test -n "$TOKOKU_KEY_ALIAS"

          gradle :app:clean :app:assembleRelease --no-daemon --stacktrace

      - name: Diagnose APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          REPORT="APK-DIAGNOSTIC.txt"

          test -s "$APK"

          {
            echo "=========================================="
            echo "TOKOKU v3.22.9 APK DIAGNOSTIC"
            echo "=========================================="
            echo ""

            echo "FILE:"
            ls -lh "$APK"
            echo ""

            echo "PACKAGE / VERSION:"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package:"
            echo ""

            echo "SDK / ABI / FEATURES:"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|uses-permission|uses-feature|native-code" || true
            echo ""

            echo "SIGNATURE:"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            echo ""

            echo "NATIVE LIBRARIES:"
            unzip -l "$APK" | grep "lib/" || echo "Tidak ada native library."
            echo ""

            echo "MANIFEST:"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E "package|versionCode|versionName|minSdkVersion|targetSdkVersion" || true
            echo ""

            echo "=========================================="
            echo "END DIAGNOSTIC"
            echo "=========================================="
          } | tee "$REPORT"

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"

          echo ""
          echo "APK BERHASIL DIBUAT DAN SIGNATURE VALID."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-Printer-Bluetooth-DIAGNOSTIC
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-APK-DIAGNOSTIC-REPORT
          path: APK-DIAGNOSTIC.txt
          if-no-files-found: error
          retention-days: 30