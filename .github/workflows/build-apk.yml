name: Build TokoKu v3.22.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract TokoKu v3.22.3
        run: |
          ZIP="./TokoKu_v3.22.5_RumahMakan_DiKolomPelanggan_RangMudoJr.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP v3.22.3 tidak ditemukan."
            ls -lah
            exit 1
          fi

          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo "Isi hasil extract:"
          find build-project -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          APP_GRADLE=$(find build-project -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan setelah extract."
            find build-project -type f -name "build.gradle" -print
            exit 1
          fi

          PROJECT_DIR="${APP_GRADLE%/app/build.gradle}"

          echo "Project TokoKu ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/tokoku-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore berhasil disiapkan."

      - name: Build TokoKu v3.21
        env:
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          cd "$PROJECT_DIR"

          echo "Build dari:"
          pwd

          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find build-project -type f -name "*.apk" -print
            exit 1
          fi

          echo "===================================="
          echo "TokoKu v3.21 BERHASIL DIBUILD"
          echo "===================================="
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "Signature APK valid."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.5-release
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk"
          if-no-files-found: error