name: Build TokoKu v3.22.9

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install required Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find TokoKu project
        shell: bash
        run: |
          echo "Mencari project Android..."

          PROJECT_DIR=""

          while IFS= read -r settings; do
            dir="$(dirname "$settings")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "PROJECT TokoKu tidak ditemukan."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-release
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error