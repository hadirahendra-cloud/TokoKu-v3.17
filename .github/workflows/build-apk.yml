name: Build TokoKu FINAL v3.22.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Checking Android SDK..."

          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

      - name: Extract TokoKu source
        run: |
          unzip -q "./TokoKu_v3.22.8_Printer_Bluetooth_Source_FIXED.zip" -d source

          echo "Isi source:"
          find source -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find source -type f -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set versionCode 31
        run: |
          echo "Menyiapkan versionCode 31"

          grep -R "versionCode" "$PROJECT_DIR/app" -n || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          echo "Mencari APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

          echo "APK ditemukan:"
          ls -lh "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_FILENAME: ${{ secrets.TOKOKU_KEYSTORE_FILENAME }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}

        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/$KEYSTORE_FILENAME"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/$KEYSTORE_FILENAME" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

      - name: Show APK information
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk" \
            | grep -E "package:|versionCode|versionName"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-FINAL
          path: TokoKu-v3.22.8-FINAL.apk
          if-no-files-found: error