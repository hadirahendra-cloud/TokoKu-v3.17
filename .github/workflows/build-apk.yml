name: Build TokoKu v3.22.9 Printer Setting

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find ZIP TokoKu v3.22.9
        run: |
          echo "=== Mencari ZIP TokoKu v3.22.9 ==="

          ZIP=$(find . -maxdepth 2 -type f \
            -iname 'TokoKu_v3.22.9*.zip' \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu v3.22.9 tidak ditemukan."
            echo "=== File yang tersedia ==="
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          echo "=== Extract project ==="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "=== Isi hasil extract ==="
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "=== Mencari settings.gradle ==="

          PROJECT=$(find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Project ditemukan di:"
          echo "$PROJECT"

          cp -R "$PROJECT"/. .

      - name: Check project version
        run: |
          echo "================================"
          echo "VERSI APLIKASI"
          echo "================================"

          grep -E \
            "versionCode|versionName" \
            app/build.gradle || true

          echo "================================"
          echo "Memastikan versionName 3.22.9"
          echo "================================"

          if ! grep -q "3.22.9" app/build.gradle; then
            echo "ERROR: app/build.gradle bukan versi 3.22.9"
            exit 1
          fi

          echo "Versi 3.22.9 terdeteksi."

      - name: Prepare release keystore
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          echo "$TOKOKU_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore berhasil disiapkan."

            - name: Build signed release APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK yang dihasilkan ==="

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name 'app-release.apk' \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: app-release.apk tidak ditemukan."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK version
        run: |
          echo "=== Verifikasi APK ==="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -E \
            "package: name='com.tokoku.app'|versionCode=|versionName="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-Printer-Setting-SIGNED
          path: ${{ env.APK }}
          if-no-files-found: error