name: Build TokoKu v3.21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode TokoKu keystore
        env:
          KEYSTORE: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > tokoku-release.jks

      - name: Build TokoKu v3.21
        env:
          TOKOKU_KEYSTORE_FILE: ${{ github.workspace }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload TokoKu v3.21 APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.21-release
          path: app/build/outputs/apk/release/app-release.apk