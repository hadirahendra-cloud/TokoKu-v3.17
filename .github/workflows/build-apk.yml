name: Build TokoKu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu Printer ZIP
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU ==="

          ZIP_FILE=$(find . -type f \
            -iname "*Printer*Bluetooth*Source*FIXED*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP TOKOKU TIDAK DITEMUKAN"
            echo "=== DAFTAR ZIP ==="
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP DITEMUKAN:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        shell: bash
        run: |
          echo "=== EXTRACT TOKOKU ==="

          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "=== HASIL EXTRACT ==="
          find tokoku-project -maxdepth 4 -type f | head -200

      - name: Find TokoKu Android project
        shell: bash
        run: |
          echo "=== MENCARI PROJECT ANDROID ==="

          PROJECT_DIR=""

          FOUND=$(find tokoku-project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -name "settings.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT ANDROID TOKOKU TIDAK DITEMUKAN"
            exit 1
          fi

          echo "PROJECT TOKOKU:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== BUILD TOKOKU DEBUG APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle clean assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "=== MENCARI APK ==="

          APK=$(find "$PROJECT_DIR" \
            -type f \
            \( -name "*debug*.apk" -o -name "*.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK DITEMUKAN:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

      - name: Test Key Password
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          echo "=== TES PASSWORD KEY ==="
          echo "Password KEY akan dicoba sama dengan password KEYSTORE."

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_PASSWORD belum tersedia."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: TOKOKU_KEY_ALIAS belum tersedia."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku.jks"

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/tokoku.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -file "$RUNNER_TEMP/test.csr"

          echo "======================================"
          echo "PASSWORD KEY = PASSWORD KEYSTORE"
          echo "TES BERHASIL."
          echo "Kita lanjut signing APK."
          echo "======================================"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          echo "=== SIGN APK TOKOKU ==="

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku.jks"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tokoku.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$RUNNER_TEMP/tokoku-signed.apk" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

          mv "$RUNNER_TEMP/tokoku-signed.apk" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

          echo "=== SIGNING BERHASIL ==="

      - name: Verify APK
        shell: bash
        run: |
          echo "=== VERIFY APK ==="

          ls -lh \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

          echo "=== APK VALID ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-SIGNED
          path: TokoKu-v3.22.8-debug.apk
          if-no-files-found: error