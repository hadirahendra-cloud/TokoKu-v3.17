name: Build TokoKu FINAL v3.22.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Android SDK siap."

      - name: Extract TokoKu
        run: |
          set -e

          ZIP="./TokoKu_v3.22.8_Printer_Bluetooth_Source_FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            echo "$ZIP"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          rm -rf TokoKu-project
          mkdir -p TokoKu-project

          unzip -q "$ZIP" -d TokoKu-project

          echo "Source berhasil diekstrak."

      - name: Find Android project
        run: |
          set -e

          APP_GRADLE=$(find TokoKu-project \
            -type f \
            -path "*/app/build.gradle" \
            -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."

            find TokoKu-project \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Prepare Gradle
        run: |
          set -e

          echo "Mencari Gradle wrapper..."

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew ditemukan."
          else
            echo "gradlew tidak ditemukan."
            echo "Gradle 8.7 dari runner akan digunakan."
          fi

      - name: Set versionCode 31
        run: |
          set -e

          FILE="$PROJECT_DIR/app/build.gradle"

          echo "Versi sebelum:"
          grep -nE "versionCode|versionName|applicationId" "$FILE" || true

          python3 - "$FILE" <<'PY'
import re
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

text, count = re.subn(
    r"(versionCode\s+)\d+",
    r"\g<1>31",
    text,
    count=1
)

if count != 1:
    raise SystemExit(
        "ERROR: versionCode tidak ditemukan."
    )

with open(path, "w", encoding="utf-8") as f:
    f.write(text)
PY

          echo "Versi sesudah:"
          grep -nE "versionCode|versionName|applicationId" "$FILE" || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle :app:clean :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: app-release.apk tidak ditemukan."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

          ls -lh "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

      - name: Prepare Keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore siap."

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tokoku-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-UNSIGNED.apk"

      - name: Verify APK
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

          echo "===== SIGNATURE ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "===== PACKAGE ====="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep "^package:"

          echo "===== APK INFO ====="

          ls -lh "$APK"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-FINAL-v31
          path: TokoKu-v3.22.8-FINAL.apk
          if-no-files-found: error
          retention-days: 30