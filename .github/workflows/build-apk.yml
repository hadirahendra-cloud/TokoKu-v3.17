name: Build TokoKu v3.22.7

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find TokoKu Project
        run: |
          echo "Mencari project TokoKu..."

          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "Project ditemukan di root repository."
          else
            ZIP=$(find . -maxdepth 2 -type f \
              -name "TokoKu_v3.22.7_Master_ManualJumlah_RangMudoJr.zip" \
              | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: ZIP TokoKu tidak ditemukan."
              exit 1
            fi

            echo "ZIP ditemukan: $ZIP"
            mkdir -p tokoku_extract
            unzip -q "$ZIP" -d tokoku_extract

            PROJECT=$(find tokoku_extract -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -path "*/app/*" | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: Project Android tidak ditemukan dalam ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$(dirname "$PROJECT")")
            echo "Project: $PROJECT_DIR"

            cp -R "$PROJECT_DIR"/. ./
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > tokoku-release.jks

          if [ ! -s tokoku-release.jks ]; then
            echo "ERROR: Keystore gagal dibuat."
            exit 1
          fi

          echo "Keystore berhasil disiapkan."

      - name: Verify TokoKu Configuration
        run: |
          echo "Checking application ID..."

          grep -R "com.tokoku.app" app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          echo "Checking version..."

          grep -R "3.22.7" app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/tokoku-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Locate Release APK
        run: |
          echo "Mencari APK release..."

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan: $APK"

          cp "$APK" "TokoKu-v3.22.7-signed.apk"

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          echo "Menggunakan: $APKSIGNER"

          "$APKSIGNER" verify --verbose \
            "TokoKu-v3.22.7-signed.apk"

          echo "SIGNATURE VALID."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-SIGNED
          path: TokoKu-v3.22.7-signed.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true