name: Build TokoKu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek File Repository
        run: |
          echo "GitHub Actions berhasil berjalan."
          echo "Isi repository:"
          find . -maxdepth 3 -type f | head -100

            - name: Cari ZIP TokoKu
        run: |
          echo "Mencari file ZIP TokoKu..."

          ZIP=$(git ls-files | grep -Ei '\.zip$' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            echo "Daftar file ZIP:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Ekstrak ZIP TokoKu
        run: |
          rm -rf tokoku-src
          mkdir -p tokoku-src
          unzip -q "$ZIP" -d tokoku-src

          echo "Isi ZIP:"
          find tokoku-src -maxdepth 4 -type f | head -100

      - name: Cari Project Android
        run: |
          APP_GRADLE=$(find tokoku-src -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/app/*" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan!"
            find tokoku-src -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Project Android ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK Debug
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Cek APK
        run: |
          echo "Mencari APK hasil build..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error