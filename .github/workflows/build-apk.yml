name: Build TokoKu v3.22.7 - Jazakumullahu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cari ZIP TokoKu
        run: |
          ZIP="./TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

      - name: Extract TokoKu
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "./TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip" \
            -d build-project

          echo "Isi hasil extract:"
          find build-project -maxdepth 4 -type f | head -100

      - name: Cari project Android
        run: |
          APP_GRADLE=$(find build-project -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find build-project -type f -path "*/app/build.gradle.kts" -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle atau app/build.gradle.kts tidak ditemukan."
            find build-project -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project Android:"
          echo "$PROJECT_DIR"

      - name: Ubah teks nota menjadi Jazakumullahu
        run: |
          echo "Mencari teks nota lama..."

          grep -RIl \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "Terima kasih telah berbelanja di TokoKu" \
            "$PROJECT_DIR" || true

          echo "Mengganti teks nota..."

          grep -RIl \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "Terima kasih telah berbelanja di TokoKu" \
            "$PROJECT_DIR" | while read -r FILE; do
              sed -i \
                's/Terima kasih telah berbelanja di TokoKu/Jazakumullahu khairan telah berbelanja di RangMudo Jr/g' \
                "$FILE"
            done

          echo "Memeriksa teks baru..."

          if grep -RIl \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "Jazakumullahu khairan telah berbelanja di RangMudo Jr" \
            "$PROJECT_DIR" | head -20; then

            echo "OK: teks Jazakumullahu ditemukan."

          else

            echo "ERROR: teks Jazakumullahu tidak ditemukan."
            echo "Mencari teks terkait nota:"
            grep -RIn \
              --exclude-dir=.gradle \
              --exclude-dir=build \
              -E "Terima kasih|TokoKu|NOTA PEMBELIAN" \
              "$PROJECT_DIR" | head -100 || true

            exit 1
          fi

      - name: Set executable Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Periksa APK
        run: |
          echo "Mencari APK hasil