name: Build TokoKu v3.22.8 PDF FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract v3.22.8 PDF FIX
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'TokoKu_v3.22.8_Penjualan_PDF_FIX_RangMudoJr.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP v3.22.8 PDF FIX tidak ditemukan"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -type f -name 'settings.gradle' -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT"

          cp -R "$PROJECT"/. .

          test -f app/build.gradle

          echo "=== Versi aplikasi ==="
          grep -E "versionCode|versionName" app/build.gradle

          grep -q "versionCode 33" app/build.gradle
          grep -q "versionName '3.22.8'" app/build.gradle

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Build signed release APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          test -n "$TOKOKU_KEYSTORE_PASSWORD"
          test -n "$TOKOKU_KEY_ALIAS"

          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" \
            | grep -E "package: name='com.tokoku.app' versionCode='33' versionName='3.22.8'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-PDF-FIX-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error