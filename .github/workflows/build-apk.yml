name: Build TokoKu v3.22.8 Penjualan FIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cari ZIP Master
        run: |
          ZIP="$(find . -type f -name 'TokoKu_v3.22.8_Penjualan_FIX_READY.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan!"
            find . -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          mkdir -p "$RUNNER_TEMP/tokoku"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/tokoku"

          PROJECT_DIR="$(find "$RUNNER_TEMP/tokoku" \
            -type f \
            -path '*/app/build.gradle' \
            -print -quit \
            | xargs -r dirname \
            | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Folder project Android tidak ditemukan!"

            find "$RUNNER_TEMP/tokoku" \
              -maxdepth 5 \
              -type f \
              -name 'build.gradle' \
              -print

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Cek Project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project TokoKu siap dibuild."

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 belum dibuat."
            exit 1
          fi

          echo "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore berhasil disiapkan."

      - name: Build signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_PASSWORD belum dibuat."
            exit 1
          fi

          if [ -z "$TOKOKU_KEY_ALIAS" ]; then
            echo "ERROR: Secret TOKOKU_KEY_ALIAS belum dibuat."
            exit 1
          fi

          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK" \
            | grep "package: name='com.tokoku.app' versionCode='31' versionName='3.22.8'"

          echo "APK TokoKu v3.22.8 berhasil dibuat."
          echo "Tanda tangan APK valid."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-Penjualan-FIX
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if