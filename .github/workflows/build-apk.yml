name: Build TokoKu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek File Repository
        run: |
          echo "GitHub Actions berhasil berjalan."
          echo "Isi repository:"
          find . -maxdepth 3 -type f | head -100

      - name: Cari ZIP TokoKu
        run: |
          echo "Mencari file ZIP..."

          find . -type f -name "*.zip" -print

          ZIP=$(find . -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Tidak ada file ZIP!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"