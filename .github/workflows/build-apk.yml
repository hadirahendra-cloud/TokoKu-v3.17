name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign TokoKu v3.22.9
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      GRADLE_VERSION: "8.9"
      APK_NAME: "TokoKu-v3.22.9-SIGNED.apk"

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. JAVA 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ---------------------------------------------------------
      # 4. INSTALL REQUIRED SDK PACKAGES
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK ready"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          echo "apksigner:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" version

          echo "zipalign:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" -h >/dev/null

      # ---------------------------------------------------------
      # 5. SETUP GRADLE
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      # ---------------------------------------------------------
      # 6. FIND TOKOKU PROJECT
      # ---------------------------------------------------------
      - name: Locate TokoKu Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 7. SHOW PROJECT STRUCTURE
      # ---------------------------------------------------------
      - name: Inspect project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            | sort

      # ---------------------------------------------------------
      # 8. MAKE GRADLE WRAPPER EXECUTABLE IF IT EXISTS
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
            echo "Gradle wrapper found."
          else
            echo "No gradlew found."
            echo "Using installed Gradle $GRADLE_VERSION."
          fi

      # ---------------------------------------------------------
      # 9. BUILD RELEASE APK
      # ---------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleRelease --no-daemon --stacktrace
          else
            gradle clean assembleRelease --no-daemon --stacktrace
          fi

      # ---------------------------------------------------------
      # 10. LOCATE RELEASE APK
      # ---------------------------------------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "Searching APK..."

          APK=""

          APK="$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | sort \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK not found."

            echo "All APK files:"
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              | sort

            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/unsigned.apk"

          echo "apk=$GITHUB_WORKSPACE/output/unsigned.apk" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 11. VERIFY INPUT APK
      # ---------------------------------------------------------
      - name: Inspect APK before signing
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/unsigned.apk"

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$APK" || true

      # ---------------------------------------------------------
      # 12. ZIPALIGN
      # ---------------------------------------------------------
      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -P 16 \
            -f \
            4 \
            "$GITHUB_WORKSPACE/output/unsigned.apk" \
            "$GITHUB_WORKSPACE/output/aligned.apk"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            -v \
            4 \
            "$GITHUB_WORKSPACE/output/aligned.apk"

      # ---------------------------------------------------------
      # 13. DECODE KEYSTORE
      # ---------------------------------------------------------
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore decoded successfully."

      # ---------------------------------------------------------
      # 14. CHECK KEYSTORE + ALIAS
      # ---------------------------------------------------------
      - name: Verify signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: TOKOKU_KEY_ALIAS is empty."
            exit 1
          fi

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/tokoku-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias are valid."

      # ---------------------------------------------------------
      # 15. SIGN APK
      # ---------------------------------------------------------
      - name: Sign APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          APK_SIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          INPUT="$GITHUB_WORKSPACE/output/aligned.apk"
          OUTPUT="$GITHUB_WORKSPACE/output/${APK_NAME}"

          rm -f "$OUTPUT"

          "$APK_SIGNER" sign \
            --ks "$RUNNER_TEMP/tokoku-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --out "$OUTPUT" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$INPUT"

          test -s "$OUTPUT"

          echo "SIGNED APK CREATED:"
          ls -lh "$OUTPUT"

      # ---------------------------------------------------------
      # 16. VERIFY SIGNATURE — CRITICAL STEP
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/${APK_NAME}"
          APK_SIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Verifying EXACT signed APK:"
          echo "$APK"

          test -f "$APK"

          "$APK_SIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "APK SIGNATURE VERIFICATION: SUCCESS"

      # ---------------------------------------------------------
      # 17. VERIFY FINAL ALIGNMENT
      # ---------------------------------------------------------
      - name: Verify final APK alignment
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "$GITHUB_WORKSPACE/output/${APK_NAME}"

      # ---------------------------------------------------------
      # 18. CHECK APK PACKAGE
      # ---------------------------------------------------------
      - name: Check APK package
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/${APK_NAME}"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id \
            "$APK"

          echo
          echo "APK size:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 19. FINAL APK
      # ---------------------------------------------------------
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp \
            "$GITHUB_WORKSPACE/output/${APK_NAME}" \
            "$GITHUB_WORKSPACE/final/${APK_NAME}"

          sha256sum \
            "$GITHUB_WORKSPACE/final/${APK_NAME}"

      # ---------------------------------------------------------
      # 20. UPLOAD SIGNED APK
      # ---------------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-SIGNED
          path: final/TokoKu-v3.22.9-SIGNED.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # 21. CLEAN SECRET FILE
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/tokoku-release.jks"