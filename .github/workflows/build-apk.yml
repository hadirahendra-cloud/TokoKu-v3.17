name: Build TokoKu v3.22.7 - Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cari ZIP Master
        run: |
          ZIP="TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

      - name: Extract Project
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip" \
            -d build-project

      - name: Locate Android Project
        run: |
          APP_GRADLE=$(find build-project \
            -type f \
            -path "*/app/build.gradle" \
            -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find build-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            find build-project -maxdepth 6 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project Android:"
          echo "$PROJECT_DIR"

      - name: Pastikan versionCode untuk update
        run: |
          echo "Memeriksa versionCode..."

          grep -RIn \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            "versionCode" \
            "$PROJECT_DIR" || true

          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          files = []
          for root, dirs, names in os.walk(project):
              dirs[:] = [d for d in dirs if d not in [".gradle", "build"]]
              for name in names:
                  if name in ("build.gradle", "build.gradle.kts"):
                      files.append(os.path.join(root, name))

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              original = text

              m = re.search(r'(\bversionCode\s*[=:]?\s*)(\d+)', text)

              if m:
                  current = int(m.group(2))

                  if current <= 24:
                      text = (
                          text[:m.start(2)]
                          + "25"
                          + text[m.end(2):]
                      )
                      print(f"versionCode {current} -> 25: {path}")

              if text != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)
          PY

      - name: Setup Gradle Wrapper
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Release
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease --no-daemon
          else
            gradle clean assembleRelease --no-daemon
          fi

      - name: Locate Unsigned APK
        run: |
          APK_UNSIGNED=$(find "$PROJECT_DIR" \
            -type f \
            -name "app-release-unsigned.apk" \
            -print -quit)

          if [ -z "$APK_UNSIGNED" ]; then
            echo "ERROR: app-release-unsigned.apk tidak ditemukan."
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          echo "APK_UNSIGNED=$APK_UNSIGNED" >> "$GITHUB_ENV"

          echo "APK unsigned:"
          ls -lh "$APK_UNSIGNED"

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_BASE64 tidak tersedia."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/tokoku-release.jks"

          test -s "$GITHUB_WORKSPACE/tokoku-release.jks"

          echo "Keystore berhasil dibuat."

      - name: Zipalign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          mkdir -p signed-apk

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$APK_UNSIGNED" \
            "signed-apk/TokoKu-v3.22.7-Jazakumullahu-aligned.apk"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/tokoku-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "signed-apk/TokoKu-v3.22.7-Jazakumullahu-SIGNED.apk" \
            "signed-apk/TokoKu-v3.22.7-Jazakumullahu-aligned.apk"

      - name: Verify APK Signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "signed-apk/TokoKu-v3.22.7-Jazakumullahu-SIGNED.apk"

      - name: Check APK
        run: |
          echo "=== APK FINAL ==="
          ls -lh signed-apk/

          echo "=== APK PACKAGE ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "signed-apk/TokoKu-v3.22.7-Jazakumullahu-SIGNED.apk" \
            | head -5

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-Jazakumullahu-SIGNED
          path: signed-apk/TokoKu-v3.22.7-Jazakumullahu-SIGNED.apk
          if-no-files-found: error