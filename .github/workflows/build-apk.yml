name: Build TokoKu v3.22.7 - Jazakumullahu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cek ZIP
        run: |
          ZIP="./TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            echo "File yang tersedia:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

      - name: Extract ZIP
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q \
            "./TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip" \
            -d build-project

          echo "Isi project:"
          find build-project -maxdepth 4 -type f | head -100

      - name: Cari Project Android
        run: |
          APP_GRADLE=$(find build-project -type f -path '*/app/build.gradle' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find build-project -type f -path '*/app/build.gradle.kts' -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            find build-project -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "APP_GRADLE=$APP_GRADLE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Pastikan Teks Nota Baru
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          old_text = "Terima kasih telah berbelanja di TokoKu"
          new_text = "Jazakumullahu khairan telah berbelanja di RangMudo Jr"

          extensions = {
              ".html",
              ".htm",
              ".js",
              ".jsx",
              ".ts",
              ".tsx",
              ".java",
              ".kt",
              ".kts",
              ".xml",
              ".json",
              ".txt",
              ".gradle",
              ".properties"
          }

          found_old = False
          found_new = False
          changed_files = []

          for path in project.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in extensions:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              if old_text in text:
                  found_old = True
                  text = text.replace(old_text, new_text)
                  path.write_text(text, encoding="utf-8")
                  changed_files.append(str(path))

              if new_text in text:
                  found_new = True

          print("File yang diubah:")
          for f in changed_files:
              print(f)

          print("Teks lama ditemukan:", found_old)
          print("Teks baru ditemukan:", found_new)

          if not found_new:
              print("ERROR: Teks Jazakumullahu tidak ditemukan.")
              print("Build dihentikan agar tidak menghasilkan APK dengan nota lama.")
              raise SystemExit(1)

          print("OK: Teks nota baru berhasil ditemukan.")
          PY

      - name: Set Gradle Executable
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Periksa APK
        run: |
          echo "APK hasil build:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-Jazakumullahu-RangMudoJr
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error