name: Diagnosis TokoKu APK

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU ==="

          ZIP_FILE=$(find . -type f \
            -iname "*Printer*Bluetooth*Source*FIXED*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP TOKOKU TIDAK DITEMUKAN"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        shell: bash
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "=== HASIL EXTRACT ==="
          find tokoku-project -maxdepth 4 -type f | head -200

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=""

          FOUND=$(find tokoku-project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -name "settings.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT ANDROID TIDAK DITEMUKAN"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJECT ==="
          echo "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew clean assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle clean assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Locate APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK DEBUG TIDAK DITEMUKAN"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-diagnosis-unsigned.apk"

          echo "=== APK ==="
          ls -lh "$APK"

      - name: APK Information Before Signing
        shell: bash
        run: |
          echo "=========================================="
          echo " INFORMASI APK SEBELUM SIGNING"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/TokoKu-diagnosis-unsigned.apk" \
            | grep -E "package:|versionCode|versionName"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          echo "=========================================="
          echo " SIGNING APK"
          echo "=========================================="

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KEYSTORE BASE64 TIDAK ADA"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE PASSWORD TIDAK ADA"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY ALIAS TIDAK ADA"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku.jks"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tokoku.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$GITHUB_WORKSPACE/TokoKu-DIAGNOSIS-SIGNED.apk" \
            "$GITHUB_WORKSPACE/TokoKu-diagnosis-unsigned.apk"

      - name: Verify Signature
        shell: bash
        run: |
          echo "=========================================="
          echo " INFORMASI SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/TokoKu-DIAGNOSIS-SIGNED.apk"

      - name: Final APK Information
        shell: bash
        run: |
          echo "=========================================="
          echo " INFORMASI FINAL TOKOKU"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/TokoKu-DIAGNOSIS-SIGNED.apk" \
            | grep -E "package:|versionCode|versionName"

          echo ""
          echo "=========================================="
          echo " FILE APK"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/TokoKu-DIAGNOSIS-SIGNED.apk"

          echo ""
          echo "=========================================="
          echo " DIAGNOSIS SELESAI"
          echo "=========================================="

      - name: Upload Diagnosis APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-DIAGNOSIS
          path: TokoKu-DIAGNOSIS-SIGNED.apk
          if-no-files-found: error