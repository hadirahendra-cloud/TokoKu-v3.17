name: Build TokoKu FINAL v3.22.8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: ./TokoKu_v3.22.8_Printer_Bluetooth_Source_FIXED.zip
      PROJECT_DIR: TokoKu-project/TokoKu_v3_Android_Project

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 4. GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 5. EXTRACT PROJECT
      # =========================================================
      - name: Extract TokoKu source
        shell: bash
        run: |
          set -e

          rm -rf TokoKu-project

          mkdir -p TokoKu-project

          unzip -q "$ZIP_FILE" -d TokoKu-project

          echo "Isi project:"
          find TokoKu-project -maxdepth 3 -type f | head -100

          test -d "$PROJECT_DIR"

      # =========================================================
      # 6. FORCE VERSION CODE 31
      # =========================================================
      - name: Set versionCode 31
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          echo "Mencari versionCode..."

          grep -n "versionCode" "$BUILD_FILE" || true

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 31/' "$BUILD_FILE"

          echo "Setelah perubahan:"
          grep -n "versionCode" "$BUILD_FILE"

          grep -q "versionCode 31" "$BUILD_FILE"

      # =========================================================
      # 7. BUILD APK
      # =========================================================
      - name: Build APK
        shell: bash
        working-directory: TokoKu-project/TokoKu_v3_Android_Project
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon

      # =========================================================
      # 8. LOCATE APK
      # =========================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL-UNSIGNED.apk"

          echo "APK ditemukan:"
          ls -lh "$APK"

      # =========================================================
      # 9. APK INFORMATION BEFORE SIGNING
      # =========================================================
      - name: APK information before signing
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INFORMASI APK SEBELUM SIGNING"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL-UNSIGNED.apk" \
            | grep -E "package:|versionCode|versionName"

      # =========================================================
      # 10. DECODE KEYSTORE
      # =========================================================
      - name: Decode TokoKu Keystore
        shell: bash
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          TOKOKU_KEYSTORE_FILENAME: ${{ secrets.TOKOKU_KEYSTORE_FILENAME }}
        run: |
          set -e

          echo "=========================================="
          echo " DECODE KEYSTORE"
          echo "=========================================="

          test -n "$TOKOKU_KEYSTORE_BASE64"
          test -n "$TOKOKU_KEYSTORE_FILENAME"

          echo "$TOKOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/$TOKOKU_KEYSTORE_FILENAME"

          test -s "$RUNNER_TEMP/$TOKOKU_KEYSTORE_FILENAME"

          echo "Keystore berhasil dibuat:"
          ls -lh "$RUNNER_TEMP/$TOKOKU_KEYSTORE_FILENAME"

      # =========================================================
      # 11. SIGN APK
      # =========================================================
      - name: Sign APK
        shell: bash
        env:
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEYSTORE_FILENAME: ${{ secrets.TOKOKU_KEYSTORE_FILENAME }}
        run: |
          set -e

          echo "=========================================="
          echo " SIGN APK TOKOKU"
          echo "=========================================="

          test -n "$TOKOKU_KEYSTORE_PASSWORD"
          test -n "$TOKOKU_KEY_ALIAS"

          KEYSTORE="$RUNNER_TEMP/$TOKOKU_KEYSTORE_FILENAME"
          INPUT="$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL-UNSIGNED.apk"
          OUTPUT="$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:TOKOKU_KEYSTORE_PASSWORD \
            --ks-key-alias "$TOKOKU_KEY_ALIAS" \
            --key-pass env:TOKOKU_KEYSTORE_PASSWORD \
            --out "$OUTPUT" \
            "$INPUT"

          test -f "$OUTPUT"

          echo "APK signed:"
          ls -lh "$OUTPUT"

      # =========================================================
      # 12. VERIFY SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " VERIFIKASI SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

      # =========================================================
      # 13. VERIFY FINAL APK INFO
      # =========================================================
      - name: Verify final APK information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk" \
            | grep -E "package:|versionCode|versionName"

      # =========================================================
      # 14. FILE CHECK
      # =========================================================
      - name: Check final APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

          test -f "$APK"

          echo "=========================================="
          echo " APK SIAP DIINSTALL"
          echo "=========================================="

          ls -lh "$APK"

            # =========================================================
      # 15. CARI DAN UPLOAD APK FINAL
      # =========================================================
      - name: Cari APK FINAL
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " MENCARI APK FINAL"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "TokoKu-v3.22.8-FINAL.apk" \
            -print -quit)

          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: APK FINAL tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_FOUND"

          ls -lh "$APK_FOUND"

          cp "$APK_FOUND" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-FINAL.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-FINAL
          path: ${{ github.workspace }}/TokoKu-v3.22.8-FINAL.apk
          if-no-files-found: error
          retention-days: 30