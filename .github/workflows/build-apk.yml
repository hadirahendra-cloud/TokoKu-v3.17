name: Build TokoKu Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        run: |
          echo "=== FILE DI REPOSITORY ==="
          find . -maxdepth 2 -type f -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP project TokoKu tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TokoKu project
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "=== HASIL EKSTRAK ==="
          find tokoku-project -maxdepth 3 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find tokoku-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
            echo "Isi ZIP:"
            find tokoku-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Android project ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la

          echo "=== GRADLE ==="
          gradle --version

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 belum ada."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore berhasil disiapkan."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILD DEBUG APK ==="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== APK HASIL BUILD ==="

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name 'app-debug.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p signed

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$APK_PATH" \
            signed/tokoku-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/tokoku-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out signed/TokoKu-v3.22.9-signed.apk \
            signed/tokoku-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            signed/TokoKu-v3.22.9-signed.apk

          echo "=== SIGNING BERHASIL ==="

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-signed
          path: ${{ env.PROJECT_DIR }}/signed/TokoKu-v3.22.9-signed.apk
          if-no-files-found: error