name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true


      # =========================================================
      # 4. GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =========================================================
      # 5. CARI ZIP TOKOKU
      # =========================================================
      - name: Find TokoKu ZIP
        shell: bash
        run: |

          echo "=========================================="
          echo " MENCARI ZIP TOKOKU"
          echo "=========================================="

          ZIP_FILE=$(find . -type f \
            -iname "*Printer*Bluetooth*Source*FIXED*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP TOKOKU TIDAK DITEMUKAN"
            echo ""
            echo "Daftar ZIP:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 6. EXTRACT
      # =========================================================
      - name: Extract TokoKu
        shell: bash
        run: |

          echo "=========================================="
          echo " EXTRACT TOKOKU"
          echo "=========================================="

          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "Extract selesai."


      # =========================================================
      # 7. CARI PROJECT ANDROID
      # =========================================================
      - name: Find Android Project
        shell: bash
        run: |

          echo "=========================================="
          echo " MENCARI PROJECT ANDROID"
          echo "=========================================="

          PROJECT_DIR=""

          FOUND=$(find tokoku-project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -name "settings.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT ANDROID TIDAK DITEMUKAN"
            exit 1
          fi

          echo "PROJECT DITEMUKAN:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 8. SET VERSION 3.22.9 / VERSION CODE 31
      # =========================================================
      - name: Set TokoKu Version 3.22.9
        shell: bash
        run: |

          echo "=========================================="
          echo " SET VERSION TOKOKU"
          echo "=========================================="

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle tidak ditemukan"
            exit 1
          fi

          echo "BUILD FILE:"
          echo "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # versionCode
          text = re.sub(
              r'(\bversionCode\s*[= ]\s*)\d+',
              r'\g<1>31',
              text,
              count=1
          )

          # versionName
          text = re.sub(
              r'(\bversionName\s*[= ]\s*)["\'][^"\']*["\']',
              r'\g<1>"3.22.9"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("versionCode -> 31")
          print("versionName -> 3.22.9")
          PY

          echo ""
          echo "=== CEK VERSION ==="

          grep -nE "versionCode|versionName" "$BUILD_FILE" || true


      # =========================================================
      # 9. PREPARE