name: Build TokoKu Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TokoKu Signed APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # =========================================================
      # 4. TAMPILKAN VERSI SDK
      # =========================================================
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version
          echo "Android SDK berhasil disiapkan."

      # =========================================================
      # 5. CARI FILE ZIP TOKOKU
      # =========================================================
      - name: Find TokoKu ZIP
        id: find_zip
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU ==="

          ZIP=$(find . -type f \
            \( -iname 'TokoKu*.zip' -o -iname 'Tokoku*.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP TokoKu tidak ditemukan."
            echo "=== DAFTAR FILE ZIP ==="
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "zip_file=$ZIP" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 6. EXTRACT ZIP
      # =========================================================
      - name: Extract TokoKu project
        shell: bash
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" \
            -d tokoku-project

          echo "=== ISI HASIL EXTRACT ==="
          find tokoku-project -maxdepth 3 -type f \
            \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      # =========================================================
      # 7. CARI ROOT PROJECT ANDROID
      # =========================================================
      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          PROJECT=$(find tokoku-project -type f -name 'gradlew' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "gradlew tidak ditemukan."

            PROJECT=$(find tokoku-project -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android TokoKu tidak ditemukan."
            echo "=== STRUKTUR FILE ==="
            find tokoku-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          # Jika yang ditemukan settings.gradle, gunakan foldernya.
          # Jika yang ditemukan gradlew, gunakan folder gradlew.
          if [ "$(basename "$PROJECT")" = "gradlew" ]; then
            PROJECT_DIR=$(dirname "$PROJECT")
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. BUAT GRADLE WRAPPER EXECUTABLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

      # =========================================================
      # 9. SIAPKAN KEYSTORE
      # =========================================================
      - name: Prepare release keystore
        shell: bash
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 kosong atau belum dibuat."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/tokoku-keystore"

          echo "$TOKOKU_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku-keystore/tokoku-release.jks"

          if [ ! -s "$RUNNER_TEMP/tokoku-keystore/tokoku-release.jks" ]; then
            echo "ERROR: Keystore gagal dibuat."
            exit 1
          fi

          echo "TOKOKU_KEYSTORE_FILE=$RUNNER_TEMP/tokoku-keystore/tokoku-release.jks" >> "$GITHUB_ENV"

          echo "Keystore berhasil disiapkan."

      # =========================================================
      # 10. BUILD RELEASE APK
      # =========================================================
      - name: Build release APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          TOKOKU_KEYSTORE_FILE: ${{ env.TOKOKU_KEYSTORE_FILE }}
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "=== BUILD RELEASE APK ==="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 11. CARI APK HASIL BUILD
      # =========================================================
      - name: Find built APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=== APK HASIL BUILD ==="

          find . -type f -name '*.apk' -print

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 12. SIGN APK JIKA BELUM SIGNED
      # =========================================================
      - name: Sign release APK
        id: sign_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          KEYSTORE_FILE: ${{ env.TOKOKU_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        shell: bash
        run: |
          APK="${{ steps.find_apk.outputs.apk }}"

          echo "Memeriksa status signing APK..."

          if apksigner verify "$APK" >/dev/null 2>&1; then
            echo "APK sudah signed."
            cp "$APK" "$RUNNER_TEMP/tokoku-signed.apk"
          else
            echo "APK belum signed. Melakukan signing..."

            mkdir -p "$RUNNER_TEMP/apk-sign"

            zipalign \
              -p \
              4 \
              "$APK" \
              "$RUNNER_TEMP/apk-sign/aligned.apk"

            apksigner sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$RUNNER_TEMP/tokoku-signed.apk" \
              "$RUNNER_TEMP/apk-sign/aligned.apk"

            echo "Signing selesai."
          fi

          apksigner verify --verbose "$RUNNER_TEMP/tokoku-signed.apk"

      # =========================================================
      # 13. SALIN APK DENGAN NAMA MUDAH
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          cp "$RUNNER_TEMP/tokoku-signed.apk" \
             "$GITHUB_WORKSPACE/TokoKu-Signed-Release.apk"

          ls -lh "$GITHUB_WORKSPACE/TokoKu-Signed-Release.apk"

      # =========================================================
      # 14. UPLOAD APK
      # =========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v5
        with:
          name: TokoKu-Signed-Release
          path: TokoKu-Signed-Release.apk
          if-no-files-found: error
          retention-days: 30