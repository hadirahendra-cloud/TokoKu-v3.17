name: Build TokoKu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu Printer ZIP
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU PRINTER ==="

          ZIP_FILE=$(find . -type f \
            -iname "*Printer*Bluetooth*Source*FIXED*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP PRINTER BLUETOOTH TIDAK DITEMUKAN"
            echo "=== DAFTAR ZIP ==="
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP YANG AKAN DIGUNAKAN:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        shell: bash
        run: |
          echo "=== EXTRACT TOKOKU ==="

          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "=== HASIL EXTRACT ==="
          find tokoku-project -maxdepth 4 -type f | head -200

      - name: Find TokoKu Android project
        shell: bash
        run: |
          echo "=== MENCARI PROJECT ANDROID ==="

          PROJECT_DIR=""

          FOUND=$(find tokoku-project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -name "settings.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PROJECT ANDROID TOKOKU TIDAK DITEMUKAN"
            exit 1
          fi

          echo "PROJECT TOKOKU:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect project
        shell: bash
        run: |
          echo "=== PROJECT DIRECTORY ==="
          echo "$PROJECT_DIR"

          echo "=== ISI PROJECT ==="
          ls -la "$PROJECT_DIR"

          if [ -d "$PROJECT_DIR/app" ]; then
            echo "=== APP DIRECTORY ==="
            ls -la "$PROJECT_DIR/app"
          fi

      - name: Prepare Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== BUILD TOKOKU DEBUG APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle clean assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "=== MENCARI APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            \( -name "*debug*.apk" -o -name "*.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK DITEMUKAN:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"
     
      - name: Verify APK
        shell: bash
        run: |
          echo "=== VERIFY APK ==="

          ls -lh \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.8-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.8-debug
          path: TokoKu-v3.22.8-debug.apk
          if-no-files-found: error