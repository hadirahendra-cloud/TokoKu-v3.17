name: Build TokoKu v3.22.7 - Penjualan FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project
        run: |
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          echo "Project TokoKu ditemukan."

      - name: Prepare Keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Build Release APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_PASSWORD belum tersedia."
            exit 1
          fi

          if [ -z "$TOKOKU_KEY_ALIAS" ]; then
            echo "ERROR: TOKOKU_KEY_ALIAS belum tersedia."
            exit 1
          fi

          gradle :app:assembleRelease --no-daemon

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-Penjualan-FIX
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error