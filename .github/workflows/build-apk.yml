name: Build TokoKu v3.21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/tokoku-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore berhasil disiapkan."

      - name: Build TokoKu v3.21
        working-directory: TokoKu_v3_Android_Project
        env:
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="TokoKu_v3_Android_Project/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "================================"
          echo "APK TokoKu v3.21 BERHASIL"
          echo "================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.21-release
          path: TokoKu_v3_Android_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error