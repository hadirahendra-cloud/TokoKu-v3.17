name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TokoKu v3.22.9
    runs-on: ubuntu-latest

    env:
      APK_NAME: TokoKu-v3.22.9-SIGNED.apk
      BUILD_TOOLS: 35.0.0

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ==========================================
      # 4. INSTALL SDK PACKAGES
      # ==========================================
      - name: Install required Android SDK
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK installation completed."

          echo "Checking build-tools..."

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"

          echo "apksigner OK"
          echo "zipalign OK"

      # ==========================================
      # 5. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find TokoKu project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT=""

          while IFS= read -r settings; do

            DIR="$(dirname "$settings")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project tidak ditemukan."

            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort | head -300

            exit 1
          fi

          PROJECT="${PROJECT#./}"

          echo "Android project ditemukan:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 7. PREPARE GRADLE
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper ditemukan."
          else
            echo "Gradle wrapper tidak ditemukan."
            echo "Workflow akan menggunakan Gradle 8.9."
          fi

      # ==========================================
      # 8. BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          cd "$PROJECT"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace

          fi

      # ==========================================
      # 9. FIND APK
      # ==========================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Searching for release APK..."

          APK=$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | sort \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK tidak ditemukan."

            echo "Semua APK:"
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              | sort

            exit 1

          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/unsigned.apk"

      # ==========================================
      # 10. ZIPALIGN
      # ==========================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

          "$ZIPALIGN" \
            -f \
            4 \
            "$GITHUB_WORKSPACE/output/unsigned.apk" \
            "$GITHUB_WORKSPACE/output/aligned.apk"

          echo "APK alignment berhasil."

      # ==========================================
      # 11. DECODE KEYSTORE
      # ==========================================
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          echo "$KEYSTORE_B64" | \
            base64 --decode > \
            "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore berhasil."

      # ==========================================
      # 12. CHECK KEY
      # ==========================================
      - name: Check signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_PASSWORD kosong."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: TOKOKU_KEY_ALIAS kosong."
            exit 1
          fi

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/tokoku-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing key valid."

      # ==========================================
      # 13. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/tokoku-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/output/$APK_NAME" \
            "$GITHUB_WORKSPACE/output/aligned.apk"

          test -s "$GITHUB_WORKSPACE/output/$APK_NAME"

          echo "SIGNED APK berhasil dibuat."

      # ==========================================
      # 14. VERIFY SIGNATURE
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          APK="$GITHUB_WORKSPACE/output/$APK_NAME"

          echo "Verifying:"
          echo "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "======================================"
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "======================================"

      # ==========================================
      # 15. VERIFY ALIGNMENT
      # ==========================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" \
            -c \
            -v \
            4 \
            "$GITHUB_WORKSPACE/output/$APK_NAME"

          echo "APK alignment verified."

      # ==========================================
      # 16. CHECK APK
      # ==========================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/output/$APK_NAME"

          echo "Final APK:"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apkanalyzer" \
            manifest application-id \
            "$APK"

      # ==========================================
      # 17. UPLOAD FINAL APK
      # ==========================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-SIGNED
          path: output/TokoKu-v3.22.9-SIGNED.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 18. CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/tokoku-release.jks"