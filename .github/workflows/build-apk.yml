name: Build TokoKu v3.22.7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find ZIP TokoKu
        run: |
          echo "Mencari ZIP..."

          ZIP=$(find . -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf tokoku-src
          mkdir -p tokoku-src

          unzip -q "$ZIP" -d tokoku-src

          echo "ZIP berhasil diekstrak."
          find tokoku-src -maxdepth 5 -type f | head -200

      - name: Find Android Project
        run: |
          PROJECT_DIR=""

          while IFS= read -r settings; do
            DIR=$(dirname "$settings")

            if [ -d "$DIR/app" ] && {
              [ -f "$DIR/app/build.gradle" ] ||
              [ -f "$DIR/app/build.gradle.kts" ];
            }; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find tokoku-src -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "Mencari berdasarkan app/build.gradle..."

            APP_GRADLE=$(find tokoku-src -type f \
              \( -path "*/app/build.gradle" -o \
                 -path "*/app/build.gradle.kts" \) \
              -print -quit)

            if [ -n "$APP_GRADLE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            echo "File Gradle yang ditemukan:"
            find tokoku-src -type f \
              \( -name "build.gradle" -o \
                 -name "build.gradle.kts" -o \
                 -name "settings.gradle" -o \
                 -name "settings.gradle.kts" \)
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT ANDROID:"
          echo "$PROJECT_DIR"
          echo "================================"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Memulai build TokoKu..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/TokoKu-v3.22.7-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-APK
          path: TokoKu-v3.22.7-debug.apk
          if-no-files-found: error