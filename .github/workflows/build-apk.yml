name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Sign TokoKu APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK components
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Install Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # 6. Find TokoKu ZIP
      - name: Find TokoKu ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f \
            \( -iname 'TokoKu*.zip' -o -iname 'Tokoku*.zip' \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP TokoKu tidak ditemukan."
            echo "Daftar file:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "zip_file=$ZIP" >> "$GITHUB_OUTPUT"

      # 7. Extract project
      - name: Extract TokoKu project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d tokoku-project

          echo "=== HASIL EXTRACT ==="
          find tokoku-project -maxdepth 4 -type f | head -300

      # 8. Locate Android project
      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find tokoku-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle / settings.gradle.kts tidak ditemukan."

            echo "=== STRUKTUR PROJECT ==="
            find tokoku-project -maxdepth 6 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 9. Check Gradle project
      - name: Check Gradle project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "=== PROJECT ==="
          pwd

          echo "=== FILE PROJECT ==="
          ls -la

          echo "=== SETTINGS ==="
          if [ -f settings.gradle ]; then
            cat settings.gradle
          elif [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

      # 10. Build Release APK
      - name: Build Release APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleRelease --no-daemon --stacktrace

      # 11. Find generated APK
      - name: Find generated APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo "=== OUTPUT BUILD ==="
            find app/build/outputs -type f -print || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 12. Prepare release keystore
      - name: Prepare release keystore
        shell: bash
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$TOKOKU_KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          echo "$TOKOKU_KEYSTORE_BASE64" | base64 --decode > tokoku-release.jks

          test -s tokoku-release.jks

          echo "Keystore berhasil dibuat."

      # 13. Verify keystore
      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore tokoku-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore dan alias berhasil diverifikasi."

      # 14. Align APK
      - name: Zipalign APK
        id: align
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p signed

          zipalign -f -p 4 \
            "${{ steps.find_apk.outputs.apk }}" \
            signed/tokoku-aligned.apk

      # 15. Sign APK
      - name: Sign APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          apksigner sign \
            --ks "${GITHUB_WORKSPACE}/tokoku-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out signed/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk \
            signed/tokoku-aligned.apk

      # 16. Verify final APK signature
      - name: Verify signed APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          apksigner verify --verbose \
            signed/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk

          echo ""
          echo "=========================================="
          echo "APK SIGNED BERHASIL"
          echo "=========================================="

      # 17. Copy final APK
      - name: Prepare artifact
        shell: bash
        run: |
          set -e

          mkdir -p final-apk

          cp "${{ steps.locate_project.outputs.project_dir }}/signed/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk" \
             final-apk/

          ls -lh final-apk/

      # 18. Upload final APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-SIGNED
          path: final-apk/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk
          if-no-files-found: error