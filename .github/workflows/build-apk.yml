name: Build TokoKu v3.21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          mkdir -p TokoKu_v3_Android_Project

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > TokoKu_v3_Android_Project/tokoku-release.jks

          test -s TokoKu_v3_Android_Project/tokoku-release.jks

          echo "Keystore berhasil disiapkan."

      - name: Build TokoKu v3.21
        working-directory: TokoKu_v3_Android_Project
        env:
          TOKOKU_KEYSTORE_FILE: ${{ github.workspace }}/TokoKu_v3_Android_Project/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          gradle --version
          gradle assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK="TokoKu_v3_Android_Project/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK TokoKu v3.21 berhasil dibuat."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.21-release
          path: TokoKu_v3_Android_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error