name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # JANGAN menggunakan action Setup Android SDK
      # Ubuntu GitHub Runner sudah menyediakan Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK tidak ditemukan"
            exit 1
          fi

          sdkmanager --version

      - name: Install required Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find TokoKu Android project
        shell: bash
        run: |
          echo "Mencari project Android..."

          PROJECT_DIR=""

          for d in \
            . \
            */ \
            */*/ \
            */*/Android \
            */*/android
          do
            if [ -f "$d/settings.gradle" ] || \
               [ -f "$d/settings.gradle.kts" ]; then
              if [ -f "$d/gradlew" ] || [ -f "$d/app/build.gradle" ] || [ -f "$d/app/build.gradle.kts" ]; then
                PROJECT_DIR="${d%/}"
                break
              fi
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "Mencari berdasarkan file app..."
            FOUND=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android TokoKu tidak ditemukan."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect TokoKu project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          ls -la

          echo "=== APP ==="
          ls -la app || true

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew tidak ditemukan."
            echo "Membuat wrapper menggunakan Gradle yang tersedia."

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew
          fi

      - name: Clean project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: Locate APK
        shell: bash
        run: |
          echo "Mencari APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload unsigned/release APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-release
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error