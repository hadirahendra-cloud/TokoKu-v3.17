name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign TokoKu APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. INSTALL REQUIRED SDK PACKAGES
      # ============================================================
      - name: Install required Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 6. FIND TOKOKU ANDROID PROJECT
      # ============================================================
      - name: Find TokoKu Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository contents ==="
          find . -maxdepth 3 -type f | head -200

          echo "=== Searching for settings.gradle ==="

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: TokoKu Android project tidak ditemukan."
            echo "Project harus mempunyai settings.gradle/settings.gradle.kts dan folder app."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "TokoKu project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. CHECK PROJECT STRUCTURE
      # ============================================================
      - name: Inspect TokoKu project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Project ==="
          pwd

          echo "=== Files ==="
          find . -maxdepth 2 -type f | sort

          echo "=== Gradle files ==="
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: folder app tidak ditemukan."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

      # ============================================================
      # 8. PREPARE GRADLE
      #
      # PENTING:
      # Tidak menjalankan "gradle clean".
      # Project TokoKu tidak mempunyai task clean.
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper ditemukan."
          else
            echo "Gradle wrapper tidak ditemukan."
            echo "Build akan menggunakan Gradle 8.7."
          fi

      # ============================================================
      # 9. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Gradle tasks ==="
          gradle tasks --all --no-daemon

          echo "=== Building release APK ==="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 10. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== APK files ==="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print

          APK="$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -not -name "*androidTest*" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK tidak ditemukan."
            exit 1
          fi

          APK="$(cd "$(dirname "$APK")" && pwd)/$(basename "$APK")"

          echo "APK ditemukan:"
          echo "$APK"

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 11. FIND BUILD TOOLS
      # ============================================================
      - name: Locate Android build tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          if [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "ERROR: zipalign tidak ditemukan."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "ERROR: apksigner tidak ditemukan."
            exit 1
          fi

          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 12. DECODE KEYSTORE
      # ============================================================
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: secret TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          if [ ! -s "$RUNNER_TEMP/tokoku-release.jks" ]; then
            echo "ERROR: keystore gagal dibuat."
            exit 1
          fi

          echo "Keystore berhasil dibuat."

      # ============================================================
      # 13. VERIFY KEYSTORE
      # ============================================================
      - name: Verify signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/tokoku-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # ============================================================
      # 14. ZIPALIGN
      # ============================================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          "$BUILD_TOOLS_DIR/zipalign" \
            -f \
            -v 4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/tokoku-aligned.apk"

          if [ ! -s "$RUNNER_TEMP/tokoku-aligned.apk" ]; then
            echo "ERROR: APK hasil zipalign tidak ditemukan."
            exit 1
          fi

      # ============================================================
      # 15. SIGN APK
      # ============================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/tokoku-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/TokoKu-v3.22.9-signed.apk" \
            "$RUNNER_TEMP/tokoku-aligned.apk"

          if [ ! -s "$RUNNER_TEMP/TokoKu-v3.22.9-signed.apk" ]; then
            echo "ERROR: Signed APK tidak berhasil dibuat."
            exit 1
          fi

      # ============================================================
      # 16. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/TokoKu-v3.22.9-signed.apk"

      # ============================================================
      # 17. CHECK APK PACKAGE
      # ============================================================
      - name: Check APK package
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" \
            dump badging \
            "$RUNNER_TEMP/TokoKu-v3.22.9-signed.apk" \
            | head -20

      # ============================================================
      # 18. FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp \
            "$RUNNER_TEMP/TokoKu-v3.22.9-signed.apk" \
            "$GITHUB_WORKSPACE/final-apk/TokoKu-v3.22.9-signed.apk"

          ls -lh "$GITHUB_WORKSPACE/final-apk/TokoKu-v3.22.9-signed.apk"

      # ============================================================
      # 19. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-SIGNED-APK
          path: final-apk/TokoKu-v3.22.9-signed.apk
          if-no-files-found: error
          retention-days: 30