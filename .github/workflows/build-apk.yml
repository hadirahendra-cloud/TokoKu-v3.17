name: Build TokoKu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        shell: bash
        run: |
          echo "=== MENCARI ZIP TOKOKU ==="

          ZIP_FILE=$(find . -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TokoKu
        shell: bash
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project

          echo "=== EXTRACT ZIP ==="
          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "=== HASIL EXTRACT ==="
          find tokoku-project -maxdepth 5 -type f | head -200

      - name: Find TokoKu Android project
        shell: bash
        run: |
          echo "=== MENCARI PROJECT ANDROID ==="

          PROJECT_DIR=""

          FOUND=$(find tokoku-project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -name "settings.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle.kts" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find tokoku-project \
              -type f \
              -path "*/app/build.gradle" \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FOUND")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "======================================"
            echo "ERROR: PROJECT ANDROID TIDAK DITEMUKAN"
            echo "======================================"

            echo ""
            echo "Struktur project yang ditemukan:"
            find tokoku-project -maxdepth 6 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "AndroidManifest.xml" \) \
              -print

            exit 1
          fi

          echo "PROJECT TOKOKU:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect project
        shell: bash
        run: |
          echo "=== PROJECT DIRECTORY ==="
          echo "$PROJECT_DIR"

          echo ""
          echo "=== ISI PROJECT ==="
          ls -la "$PROJECT_DIR"

          echo ""
          echo "=== APP DIRECTORY ==="

          if [ -d "$PROJECT_DIR/app" ]; then
            ls -la "$PROJECT_DIR/app"
          else
            echo "PERINGATAN: folder app tidak ditemukan."
          fi

      - name: Prepare Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== CEK GRADLE ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            echo "Gradle wrapper ditemukan."
            ./gradlew --version
          else
            echo "Gradle wrapper tidak ditemukan."
            echo "Menggunakan Gradle 8.7."
            gradle --version
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILD TOKOKU DEBUG APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "=== MENCARI APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK DEBUG TIDAK DITEMUKAN."
            exit 1
          fi

          echo ""
          echo "APK DITEMUKAN:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.9-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          echo "=== CEK APK ==="

          ls -lh \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.9-debug.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$GITHUB_WORKSPACE/TokoKu-v3.22.9-debug.apk"

          echo "APK BERHASIL DIVERIFIKASI."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-debug
          path: TokoKu-v3.22.9-debug.apk
          if-no-files-found: error