name: Build TokoKu v3.21

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        run: |
          APP_GRADLE=$(find . -type f -path '*/app/build.gradle' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="${APP_GRADLE%/app/build.gradle}"

          echo "================================"
          echo "PROJECT DITEMUKAN:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/tokoku-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "TOKOKU_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore siap."

      - name: Verify TokoKu version
        run: |
          grep "versionCode 21" "$PROJECT_DIR/app/build.gradle"
          grep "versionName '3.21'" "$PROJECT_DIR/app/build.gradle"
          grep "targetSdk 34" "$PROJECT_DIR/app/build.gradle"

      - name: Build TokoKu v3.21
        env:
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          cd "$PROJECT_DIR"

          echo "Build directory:"
          pwd

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "================================"
          echo "TokoKu v3.21 BERHASIL DIBUILD"
          echo "================================"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

          echo "Signature APK valid."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.21-release
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk"
          if-no-files-found: error