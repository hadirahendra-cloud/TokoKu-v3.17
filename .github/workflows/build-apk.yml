name: Build TokoKu v3.22.9 Printer Bluetooth

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract TokoKu v3.22.9
        run: |
          set -e
          ZIP="./TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            ls -lah
            exit 1
          fi

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path "*/app/build.gradle" -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            find build-project -maxdepth 6 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle
          grep -q "versionCode 32" app/build.gradle
          grep -q "versionName '3.22.9'" app/build.gradle
          grep -q "applicationId 'com.tokoku.app'" app/build.gradle
          echo "TokoKu v3.22.9 source OK"

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"
          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Build signed release APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          set -e
          test -n "$TOKOKU_KEYSTORE_PASSWORD"
          test -n "$TOKOKU_KEY_ALIAS"
          gradle :app:clean :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.tokoku.app' versionCode='32' versionName='3.22.9'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-Printer-Bluetooth-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
