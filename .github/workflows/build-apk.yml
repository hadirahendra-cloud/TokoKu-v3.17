name: Build TokoKu v3.22.7 - Jazakumullahu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cari ZIP Master
        run: |
          ZIP="TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

      - name: Extract Project
        run: |
          rm -rf build-project
          mkdir build-project

          unzip -q \
            "TokoKu_v3.22.7_Master_ManualJumlah_NotaJazakumullahu_RangMudoJr.zip" \
            -d build-project

      - name: Cari Project Android
        run: |
          APP_GRADLE=$(find build-project -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find build-project -type f -path "*/app/build.gradle.kts" -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Cek Teks Nota
        run: |
          grep -RIl \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "Jazakumullahu khairan telah berbelanja di RangMudo Jr" \
            "$PROJECT_DIR" | head -20

      - name: Setup Gradle Wrapper
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Cari APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.7-Jazakumullahu-Release
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error