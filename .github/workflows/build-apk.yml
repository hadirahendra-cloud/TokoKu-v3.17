name: Build TokoKu v3.22.9 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Android SDK + Build Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 5. Pastikan tools benar-benar ada
      - name: Verify Android Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          echo "zipalign OK"
          echo "apksigner OK"
          echo "aapt OK"

      # 6. Cari ZIP TokoKu otomatis
      - name: Find TokoKu ZIP
        run: |
          echo "=== FILE DI REPOSITORY ==="
          find . -maxdepth 3 -type f -print

          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -iname '*TokoKu*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan."
            exit 1
          fi

          echo "ZIP DITEMUKAN:"
          echo "$ZIP"

          echo "TOKOKU_ZIP=$ZIP" >> "$GITHUB_ENV"

      # 7. Extract project
      - name: Extract TokoKu project
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q "$TOKOKU_ZIP" -d build-project

          echo "=== HASIL EXTRACT ==="
          find build-project -maxdepth 5 -type f | head -150

          APP_GRADLE="$(find build-project \
            -type f \
            -path '*/app/build.gradle' \
            -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE="$(find build-project \
              -type f \
              -path '*/app/build.gradle.kts' \
              -print -quit)"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle atau app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "APP GRADLE:"
          echo "$APP_GRADLE"

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          echo "PROJECT DIR:"
          echo "$PROJECT_DIR"

          rm -rf tokoku-project
          mkdir -p tokoku-project

          cp -R "$PROJECT_DIR"/. tokoku-project/

          echo "=== PROJECT ==="
          find tokoku-project -maxdepth 3 -type f | head -150

          test -f tokoku-project/app/build.gradle \
            || test -f tokoku-project/app/build.gradle.kts

      # 8. Decode keystore
      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "Keystore berhasil disiapkan."

      # 9. Build release
      - name: Build TokoKu release
        working-directory: tokoku-project
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_PASSWORD kosong."
            exit 1
          fi

          if [ -z "$TOKOKU_KEY_ALIAS" ]; then
            echo "ERROR: TOKOKU_KEY_ALIAS kosong."
            exit 1
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      # 10. Cari APK hasil build
      - name: Locate APK
        working-directory: tokoku-project
        run: |
          echo "=== APK HASIL BUILD ==="

          find . -type f -name '*.apk' -print

          APK="$(find app/build/outputs -type f \
            -name '*.apk' \
            | grep -E 'release|unsigned' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK ditemukan: $APK"

      # 11. Pastikan APK sudah aligned
      # Tidak menggunakan command 'zipalign' dari PATH.
      - name: Verify APK alignment
        working-directory: tokoku-project
        run: |
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          echo "Menggunakan:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      # 12. Verifikasi tanda tangan
      - name: Verify APK signature
        working-directory: tokoku-project
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          echo "=== SIGNATURE ==="

          "$APKSIGNER" verify --verbose "$APK"

          echo "=== CERTIFICATE ==="

          "$APKSIGNER" verify --print-certs "$APK"

      # 13. Tampilkan informasi APK
      - name: Check APK package
        working-directory: tokoku-project
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" | head -n 5

      # 14. Rename APK supaya gampang ditemukan
      - name: Prepare final APK
        working-directory: tokoku-project
        run: |
          mkdir -p final-apk

          cp "$APK" \
            final-apk/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk

          ls -lh final-apk/

      # 15. Upload APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-RangMudoJr-SIGNED
          path: tokoku-project/final-apk/TokoKu-v3.22.9-RangMudoJr-SIGNED.apk
          if-no-files-found: error