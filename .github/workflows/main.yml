name: Build TokoKu v3.22.9 Printer Bluetooth

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find TokoKu ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP TokoKu v3.22.9 tidak ditemukan."
            echo "Daftar file:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          rm -rf tokoku-project
          mkdir -p tokoku-project

          unzip -q "$ZIP_FILE" -d tokoku-project

          echo "Isi project:"
          find tokoku-project -maxdepth 3 -type f | sort

      - name: Check Android project
        run: |
          test -f tokoku-project/settings.gradle
          test -f tokoku-project/build.gradle
          test -f tokoku-project/app/build.gradle
          test -f tokoku-project/app/src/main/AndroidManifest.xml

          echo "Project Android VALID."

      - name: Prepare signing keystore
        env:
          TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          if [ -z "$TOKOKU_KEYSTORE_BASE64" ]; then
            echo "ERROR: TOKOKU_KEYSTORE_BASE64 belum tersedia di GitHub Secrets."
            exit 1
          fi

          echo "$TOKOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"

          test -s "$RUNNER_TEMP/tokoku-release.jks"

          echo "TOKOKU_KEYSTORE_FILE=$RUNNER_TEMP/tokoku-release.jks" >> "$GITHUB_ENV"
          echo "Keystore berhasil disiapkan."

      - name: Build signed Release APK
        working-directory: tokoku-project
        env:
          TOKOKU_KEYSTORE_FILE: ${{ env.TOKOKU_KEYSTORE_FILE }}
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find tokoku-project/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "APK SIGNED dan VALID."

      - name: Rename APK
        run: |
          APK=$(find tokoku-project/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          cp "$APK" \
            "TokoKu-v3.22.9-Printer-Bluetooth-SIGNED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.9-Printer-Bluetooth-SIGNED
          path: TokoKu-v3.22.9-Printer-Bluetooth-SIGNED.apk
          if-no-files-found: error
