name: Build TokoKu v3.22.15 - Pengeluaran Harian FINAL2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK TokoKu v3.22.15
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Check Android project
        run: |
          set -e

          echo "=== CHECK PROJECT ==="
          pwd
          echo "--- ROOT ---"
          ls -la

          test -f settings.gradle
          test -f app/build.gradle

          echo "Android project ditemukan di root repository."

      - name: Check TokoKu version and feature
        run: |
          set -e

          echo "=== CHECK VERSION ==="

          grep -q "versionCode 40" app/build.gradle
          grep -q "versionName '3.22.15'" app/build.gradle

          echo "=== CHECK PENGELUARAN HARIAN ==="

          test -f app/src/main/assets/index.html

          grep -q "Pengeluaran Harian" \
            app/src/main/assets/index.html

          grep -q "expenseDayTabs" \
            app/src/main/assets/index.html

          echo "================================"
          echo "TokoKu v3.22.15"
          echo "Pengeluaran Harian"
          echo "CHECK BERHASIL"
          echo "================================"

      - name: Build DEBUG APK
        run: |
          set -e

          echo "=== BUILD APK ==="

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -s app/build/outputs/apk/debug/app-debug.apk

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/TokoKu-v3.22.15-Pengeluaran-Harian.apk

          echo "APK berhasil dibuat."

      - name: Verify APK
        run: |
          set -e

          echo "=== VERIFY APK ==="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/debug/app-debug.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "versionCode='40' versionName='3.22.15'"

          echo "APK VERIFY BERHASIL."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Pengeluaran-Harian
          path: output/TokoKu-v3.22.15-Pengeluaran-Harian.apk
          if-no-files-found: error
          retention-days: 30