name: Build TokoKu v3.22.15 - Auto Sign

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ONLY v3.22.9 source
        run: |
          set -e

          ZIP="TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip"

          test -f "$ZIP" || {
            echo "ERROR: $ZIP tidak ditemukan"
            exit 1
          }

          rm -rf build-project
          mkdir build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -path '*/app/*' -print -quit)"

          test -n "$APP_GRADLE" || {
            echo "ERROR: app/build.gradle tidak ditemukan"
            find build-project -maxdepth 4 -type f | head -100
            exit 1
          }

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "SOURCE BERHASIL DIPAKAI:"
          echo "$ZIP"

      - name: Fix receipt footer
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          old_list = [
              "Terima kasih telah berbelanja di TokoKu",
              "Terima kasih telah berbelanja di Tokoku",
              "Terimakasih telah berbelanja di TokoKu",
              "Terimakasih telah berbelanja di Tokoku",
          ]

          new = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"

          changed = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in {
                  ".html",".htm",".js",".jsx",".ts",".tsx",
                  ".kt",".java",".xml",".json",".txt"
              }:
                  continue

              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              ns = s

              for old in old_list:
                  ns = ns.replace(old, new)

              if ns != s:
                  p.write_text(ns, encoding="utf-8")
                  changed.append(str(p))

          print("Footer changed:", changed)

          hits = []

          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      if new in p.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ):
                          hits.append(str(p))
                  except Exception:
                      pass

          if not hits:
              raise SystemExit(
                  "STOP: teks footer baru tidak ditemukan."
              )

          print("Footer verified:", hits)
          PY

      - name: Add Pengeluaran Tab Per Hari
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          candidates = list(
              Path("app/src/main").rglob("index.html")
          )

          if not candidates:
              raise SystemExit(
                  "STOP: index.html tidak ditemukan."
              )

          target = candidates[0]

          s = target.read_text(
              encoding="utf-8"
          )

          if "tokoku-pengeluaran-tab-harian-v2" in s:
              print("Tab pengeluaran sudah ada.")
              raise SystemExit(0)

          patch = r"""
          <style id="tokoku-pengeluaran-tab-harian-v2">
          #tokoku-expense-tabs-wrap{
            margin:12px 0;
          }

          #tokoku-expense-tabs{
            display:flex;
            gap:8px;
            overflow-x:auto;
            padding:4px 2px 10px;
            scrollbar-width:none;
          }

          #tokoku-expense-tabs::-webkit-scrollbar{
            display:none;
          }

          .tokoku-expense-tab{
            flex:0 0 auto;
            border:1px solid #dce4ec;
            background:#fff;
            color:#65717f;
            border-radius:12px;
            padding:9px 13px;
            font-size:12px;
            font-weight:700;
          }

          .tokoku-expense-tab.active{
            background:#1476df;
            color:#fff;
            border-color:#1476df;
          }

          #tokoku-expense-summary{
            display:flex;
            justify-content:space-between;
            gap:8px;
            align-items:center;
            background:#f5f9ff;
            border:1px solid #dce8f7;
            border-radius:12px;
            padding:11px 12px;
            margin-bottom:10px;
          }

          #tokoku-expense-summary .t-label{
            font-size:11px;
            color:#687585;
          }

          #tokoku-expense-summary .t-total{
            font-size:17px;
            font-weight:800;
          }

          .tokoku-expense-day{
            display:none;
          }

          .tokoku-expense-day.active{
            display:block;
          }
          </style>

          <script id="tokoku-pengeluaran-tab-harian-v2">
          (function(){

            "use strict";

            const WRAP_ID =
              "tokoku-expense-tabs-wrap";

            function getDate(text){

              text = String(text || "");

              let m = text.match(
                /(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/
              );

              if(m){
                return (
                  m[3] + "-" +
                  m[2].padStart(2,"0") + "-" +
                  m[1].padStart(2,"0")
                );
              }

              m = text.match(
                /(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/
              );

              if(m){
                return (
                  m[1] + "-" +
                  m[2].padStart(2,"0") + "-" +
                  m[3].padStart(2,"0")
                );
              }

              return "";
            }

            function label(date){

              if(!date)
                return "Tanpa tanggal";

              const p = date.split("-");

              const d = new Date(
                Number(p[0]),
                Number(p[1])-1,
                Number(p[2])
              );

              return d.toLocaleDateString(
                "id-ID",
                {
                  weekday:"short",
                  day:"2-digit",
                  month:"short"
                }
              );
            }

            function findSection(){

              const nodes =
                [...document.querySelectorAll(
                  "section,main,div"
                )];

              return nodes.find(el => {

                const text =
                  el.innerText || "";

                return (
                  /pengeluaran/i.test(text) &&
                  el.querySelector(
                    "button,input,select"
                  )
                );

              });
            }

            function findItems(section){

              const selectors = [
                "#expenseList > *",
                ".expense-list > *",
                ".pengeluaran-list > *",
                "[id*=expense] .card",
                "[id*=pengeluaran] .card",
                "[class*=expense] .card",
                "[class*=pengeluaran] .card"
              ];

              for(const selector of selectors){

                const items =
                  [...section.querySelectorAll(selector)];

                if(items.length)
                  return items;
              }

              return [];
            }

            function build(){

              const section =
                findSection();

              if(!section)
                return;

              const items =
                findItems(section);

              if(!items.length)
                return;

              const groups =
                new Map();

              items.forEach(item => {

                const date =
                  getDate(item.innerText);

                if(!date)
                  return;

                if(!groups.has(date))
                  groups.set(date,[]);

                groups.get(date).push(item);
              });

              if(!groups.size)
                return;

              const old =
                document.getElementById(
                  WRAP_ID
                );

              if(old)
                old.remove();

              const dates =
                [...groups.keys()]
                .sort()
                .reverse();

              const wrap =
                document.createElement("div");

              wrap.id =
                WRAP_ID;

              wrap.innerHTML = `
                <div id="tokoku-expense-tabs"></div>

                <div id="tokoku-expense-summary">
                  <div>
                    <div class="t-label">
                      Pengeluaran hari terpilih
                    </div>

                    <div
                      class="t-total"
                      id="tokoku-expense-total">
                      Rp 0
                    </div>
                  </div>

                  <div
                    class="t-label"
                    id="tokoku-expense-count">
                  </div>
                </div>
              `;

              section.prepend(wrap);

              const tabs =
                wrap.querySelector(
                  "#tokoku-expense-tabs"
                );

              const total =
                wrap.querySelector(
                  "#tokoku-expense-total"
                );

              const count =
                wrap.querySelector(
                  "#tokoku-expense-count"
                );

              function select(date){

                tabs.querySelectorAll(
                  "button"
                ).forEach(button => {

                  button.classList.toggle(
                    "active",
                    button.dataset.date === date
                  );

                });

                items.forEach(item => {

                  const itemDate =
                    getDate(item.innerText);

                  item.style.display =
                    itemDate === date
                    ? ""
                    : "none";

                });

                const selected =
                  groups.get(date) || [];

                let sum = 0;

                selected.forEach(item => {

                  const matches =
                    (
                      item.innerText || ""
                    ).match(
                      /(?:Rp\s*)?[\d.]+/g
                    ) || [];

                  if(matches.length){

                    const last =
                      matches[matches.length-1]
                      .replace(/[^\d]/g,"");

                    sum += Number(last) || 0;
                  }

                });

                total.textContent =
                  "Rp " +
                  sum.toLocaleString("id-ID");

                count.textContent =
                  selected.length +
                  " transaksi";
              }

              dates.forEach(
                (date,index) => {

                  const button =
                    document.createElement(
                      "button"
                    );

                  button.className =
                    "tokoku-expense-tab" +
                    (index === 0
                      ? " active"
                      : "");

                  button.dataset.date =
                    date;

                  button.textContent =
                    label(date);

                  button.onclick =
                    () => select(date);

                  tabs.appendChild(button);
                }
              );

              select(dates[0]);
            }

            let timer;

            function schedule(){

              clearTimeout(timer);

              timer =
                setTimeout(build,500);
            }

            document.addEventListener(
              "DOMContentLoaded",
              schedule
            );

            window.addEventListener(
              "load",
              schedule
            );

            new MutationObserver(
              schedule
            ).observe(
              document.documentElement,
              {
                subtree:true,
                childList:true
              }
            );

          })();
          </script>
          """

          pos = s.lower().rfind("</body>")

          if pos < 0:
              raise SystemExit(
                  "STOP: </body> tidak ditemukan."
              )

          s =
              s[:pos] +
              patch +
              s[pos:]

          target.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "Pengeluaran tab ditambahkan:",
              target
          )
          PY

      - name: Set version 3.22.15
        run: |
          set -e

          if [ -f app/build.gradle ]; then

            sed -i -E \
              "s/versionCode[[:space:]]+[0-9]+/versionCode 40/" \
              app/build.gradle

            sed -i -E \
              "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '3.22.15'/" \
              app/build.gradle

            grep -q "versionCode 40" \
              app/build.gradle

            grep -q "versionName '3.22.15'" \
              app/build.gradle

          else

            echo "ERROR: app/build.gradle tidak ditemukan"
            exit 1

          fi

      - name: Build APK
        run: |
          set -e

          gradle :app:clean :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare existing release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" |
            base64 --decode \
            > "$RUNNER_TEMP/tokoku-release.jks"

          test -s \
            "$RUNNER_TEMP/tokoku-release.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          KS="$RUNNER_TEMP/tokoku-release.jks"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/TokoKu-v3.22.15-Jazakumullah-RangMudoJr.apk"

          test -n "$KEYSTORE_PASSWORD"

          ALIAS="$SECRET_ALIAS"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              keytool -list -v \
                -keystore "$KS" \
                -storepass "$KEYSTORE_PASSWORD" |
              awk -F': ' \
                '/Alias name:/{print $2; exit}'
            )"
          fi

          test -n "$ALIAS"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" \
            "$APK"

          test -s "$OUT"

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/TokoKu-v3.22.15-Jazakumullah-RangMudoJr.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" |
            grep -E \
            "versionCode='40' versionName='3.22.15'"

          mkdir -p output

          cp "$APK" \
            "output/TokoKu-v3.22.15-Jazakumullah-RangMudoJr.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.15-Jazakumullah-RangMudoJr
          path: output/TokoKu-v3.22.15-Jazakumullah-RangMudoJr.apk
          if-no-files-found: error
          retention-days: 30
