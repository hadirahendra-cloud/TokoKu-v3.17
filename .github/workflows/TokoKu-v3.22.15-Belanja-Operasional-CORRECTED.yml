name: Build TokoKu v3.22.15 - Belanja Operasional - FINAL FIX 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract TokoKu source
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TokoKu tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle.kts' -print -quit)"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android project tidak ditemukan."
            find build-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          echo "Project ditemukan: $PROJECT_DIR"

          cp -R "$PROJECT_DIR/." .

      - name: Fix receipt footer
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          new_text = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"

          old_texts = [
              "Terima kasih telah berbelanja di TokoKu",
              "Terima kasih telah berbelanja di Tokoku",
              "Terimakasih telah berbelanja di TokoKu",
              "Terimakasih telah berbelanja di Tokoku",
          ]

          changed = 0

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in {
                  ".html", ".htm", ".js", ".jsx",
                  ".ts", ".tsx", ".kt", ".java",
                  ".xml", ".json", ".txt"
              }:
                  continue

              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              new_value = text

              for old in old_texts:
                  new_value = new_value.replace(old, new_text)

              if new_value != text: