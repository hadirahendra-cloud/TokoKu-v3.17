name: Inspect TokoKu Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract TokoKu
        run: |
          ZIP=$(find . -maxdepth 2 -type f \
            -name "TokoKu-v3.22.7-Penjualan-FIX-FINAL.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          mkdir -p tokoku_extract
          unzip -q "$ZIP" -d tokoku_extract

      - name: Inspect index.html
        run: |
          FILE="tokoku_extract/app/src/main/assets/index.html"

          echo "======================================"
          echo "FILE:"
          echo "$FILE"
          echo "======================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BARIS RINGKASAN / PENJUALAN / AKSES CEPAT"
          echo "======================================"

          grep -nEi \
            "Ringkasan Toko|Ringkasan|Akses Cepat|Penjualan" \
            "$FILE" | head -100 || true

          echo ""
          echo "======================================"
          echo "JUMLAH BARIS index.html"
          echo "======================================"

          wc -l "$FILE"

          echo ""
          echo "======================================"
          echo "SCRIPT JAVASCRIPT"
          echo "======================================"

          grep -nEi \
            "<script|function |const |let |var " \
            "$FILE" | head -100 || true