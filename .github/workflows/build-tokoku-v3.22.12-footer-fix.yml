name: Build TokoKu v3.22.12 - FIX Footer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          set -e
          ZIP="$(find . -type f -name 'TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf build-project
          mkdir build-project
          unzip -q "$ZIP" -d build-project
          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE"
          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          cp -R "$PROJECT_DIR/." .
          test -f app/src/main/assets/index.html

      - name: Change EXACT receipt footer
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          old = "Terima kasih telah berbelanja di TokoKu"
          new = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"
          if old not in s:
              raise SystemExit("STOP: teks lama tidak ditemukan di index.html")
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          if new not in p.read_text(encoding="utf-8"):
              raise SystemExit("STOP: teks baru tidak tersimpan")
          print("FOOTER:", new)
          PY

      - name: Set version 3.22.12
        run: |
          set -e
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 36/" app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '3.22.12'/" app/build.gradle
          grep -q "versionCode 36" app/build.gradle
          grep -q "versionName '3.22.12'" app/build.gradle

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"
          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Build signed APK
        env:
          TOKOKU_KEYSTORE_FILE: ${{ runner.temp }}/tokoku-release.jks
          TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e
          gradle :app:clean :app:assembleRelease --no-daemon --stacktrace

      - name: Verify final APK and footer
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.tokoku.app' versionCode='36' versionName='3.22.12'"
          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/index-final.html"
          grep -F "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr" "$RUNNER_TEMP/index-final.html"
          ! grep -F "Terima kasih telah berbelanja di TokoKu" "$RUNNER_TEMP/index-final.html"
          mkdir -p output
          cp "$APK" output/TokoKu-v3.22.12-Jazakumullah-RangMudoJr.apk

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.12-Jazakumullah-RangMudoJr
          path: output/TokoKu-v3.22.12-Jazakumullah-RangMudoJr.apk
          if-no-files-found: error
