name: Build TokoKu v3.22.14 - Auto Sign

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract TokoKu source
        run: |
          set -e
          ZIP="$(find . -type f -name 'TokoKu-v3.22.9-Printer-Bluetooth-GITHUB-READY.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' -print -quit)"
          fi
          test -n "$ZIP"

          rm -rf build-project
          mkdir build-project
          unzip -q "$ZIP" -d build-project

          APP_GRADLE="$(find build-project -type f -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE"

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          cp -R "$PROJECT_DIR/." .

          test -f app/build.gradle

      - name: Fix receipt footer
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          old_list = [
              "Terima kasih telah berbelanja di TokoKu",
              "Terima kasih telah berbelanja di Tokoku",
              "Terimakasih telah berbelanja di TokoKu",
              "Terimakasih telah berbelanja di Tokoku",
          ]
          new = "Jazakumullah Khairon telah berbelanja di Toko RangMudo Jr"

          changed = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix.lower() not in {
                  ".html",".htm",".js",".jsx",".ts",".tsx",
                  ".kt",".java",".xml",".json",".txt"
              }:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              ns = s
              for old in old_list:
                  ns = ns.replace(old, new)

              if ns != s:
                  p.write_text(ns, encoding="utf-8")
                  changed.append(str(p))

          print("Footer files changed:", changed)

          # Do not silently build the old footer.
          hits = []
          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      if new in p.read_text(encoding="utf-8", errors="ignore"):
                          hits.append(str(p))
                  except Exception:
                      pass

          if not hits:
              raise SystemExit(
                  "STOP: footer baru tidak ditemukan. Source kemungkinan berbeda dari yang diharapkan."
              )

          print("Footer verified:", hits)
          PY

      - name: Set version 3.22.14
        run: |
          set -e
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 39/" app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\"][^'\"]+['\"]/versionName '3.22.14'/" app/build.gradle

          grep -q "versionCode 39" app/build.gradle
          grep -q "versionName '3.22.14'" app/build.gradle

      - name: Build DEBUG APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare existing release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tokoku-release.jks"
          test -s "$RUNNER_TEMP/tokoku-release.jks"

      - name: Detect signing alias and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -e

          KS="$RUNNER_TEMP/tokoku-release.jks"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="app/build/outputs/apk/debug/TokoKu-v3.22.14-Jazakumullah-RangMudoJr.apk"

          test -n "$KEYSTORE_PASSWORD"

          echo "Checking keystore..."
          keytool -list -keystore "$KS" \
            -storepass "$KEYSTORE_PASSWORD" >/tmp/keystore.txt

          echo "Keystore is readable."

          # Get the first private-key alias automatically.
          ALIAS="$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
            awk -F': ' '/Alias name:/{print $2; exit}')"

          if [ -z "$ALIAS" ]; then
            ALIAS="$SECRET_ALIAS"
          fi

          test -n "$ALIAS"
          echo "Using detected signing alias: $ALIAS"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          # First try the configured key password.
          if [ -n "$KEY_PASSWORD" ]; then
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$OUT" \
              "$APK" || rm -f "$OUT"
          fi

          # If key password is the same as keystore password, retry with it.
          if [ ! -s "$OUT" ]; then
            echo "Retrying signing with keystore password as key password..."
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              --out "$OUT" \
              "$APK"
          fi

          test -s "$OUT"

      - name: Verify final APK and update compatibility
        run: |
          set -e

          APK="app/build/outputs/apk/debug/TokoKu-v3.22.14-Jazakumullah-RangMudoJr.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING"

          echo "$BADGING" | grep -E "versionCode='39' versionName='3.22.14'"

          mkdir -p output
          cp "$APK" "output/TokoKu-v3.22.14-Jazakumullah-RangMudoJr.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3.22.14-Jazakumullah-RangMudoJr
          path: output/TokoKu-v3.22.14-Jazakumullah-RangMudoJr.apk
          if-no-files-found: error
          retention-days: 30
